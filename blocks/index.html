<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a62c6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="블록팡팡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>블록 팡팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap">
<style>
/* Layout: one canvas draws score, 8x8 board and the 3-piece tray; menu and result cards float over it. */
:root{
  --bg:#4a62c6;
  --bg2:#3a4fae;
  --ink:#1d2a44;
  --muted:#5b6d8c;
  --gold:#ffc83d;
  --green:#3fbf55;
  --red:#ff5a5a;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));color:#fff;font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{position:relative;height:100%;max-width:560px;margin:0 auto}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
#probe{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;align-items:center;gap:10px;padding:0 12px;pointer-events:none}
.spacer{flex:1}
button{font-family:var(--display);font-size:24px;color:#fff;background:var(--red);border:0;border-radius:18px;padding:12px 34px;box-shadow:0 5px 0 #b83030;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b83030}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.round{width:44px;height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:24px;box-shadow:none;flex:none}
button.round:active{transform:scale(.92)}
button:disabled{opacity:.35}
.layer{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 30px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);background:linear-gradient(rgba(74,98,198,.92),rgba(58,79,174,.95))}
.logo{font-family:"Black Han Sans",var(--display);font-weight:400;font-size:62px;line-height:1;margin:0 0 4px;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.logo span:nth-child(1){color:#ff6b5e}.logo span:nth-child(2){color:#ffc83d}.logo span:nth-child(3){color:#5fd36a}.logo span:nth-child(4){color:#5cc9f5}
.minis{display:grid;grid-template-columns:repeat(4,28px);gap:3px;margin-bottom:6px}
.minis i{width:28px;height:28px;border-radius:5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 5px 0 rgba(255,255,255,.3)}
.best{display:flex;align-items:center;gap:8px;font-family:"Black Han Sans",var(--display);font-size:28px;color:var(--gold)}
.modes{display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
.mode{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:26px;padding:16px 12px}
.mode button.big{width:100%;font-size:28px;padding:14px 10px}
.stage{background:var(--green);box-shadow:0 5px 0 #24823a}
.stage:active{box-shadow:0 2px 0 #24823a}
.endless{background:#ff8a3d;box-shadow:0 5px 0 #c25a17}
.endless:active{box-shadow:0 2px 0 #c25a17}
.lvlsel{display:flex;align-items:center;gap:10px}
.lvl{font-family:var(--display);font-size:22px;color:var(--ink);background:#fff;border-radius:999px;padding:6px 18px;min-width:120px;text-align:center}
.sub{font-size:16px;opacity:.85}
.card{background:#fff;color:var(--ink);border-radius:30px;padding:26px 20px;box-shadow:0 14px 40px rgba(0,0,0,.3);width:min(330px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0}
.card .num{font-family:"Black Han Sans",var(--display);font-size:64px;line-height:1;color:#4a62c6}
.card p{margin:0;color:var(--muted);font-size:18px}
.card .new{color:#ff7a00;font-family:var(--display);font-size:24px}
.card .row{display:flex;gap:10px;justify-content:center;width:100%}
.card .row button{flex:1;padding:12px 8px;font-size:22px}
.card button.gray{background:#b9c2d3;box-shadow:0 5px 0 #8b95aa}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.rules{display:flex;flex-direction:column;gap:12px;text-align:left;font-size:18px;width:100%}
.rules div{display:flex;gap:12px;align-items:center}
.rules b{font-size:30px;min-width:40px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div id="probe"></div>
  <canvas id="cv"></canvas>

  <div class="top">
    <button class="round" id="homeBtn" aria-label="처음으로">⌂</button>
    <span class="spacer"></span>
    <button class="round" id="helpBtn" aria-label="게임 방법">?</button>
    <button class="round" id="soundBtn" aria-label="소리">🔊</button>
  </div>

  <div class="layer" id="menu">
    <div class="minis" aria-hidden="true">
      <i style="background:#e8443a"></i><i style="background:#e8443a"></i><i style="background:#f5c43a"></i><i style="background:#f5c43a"></i>
      <i style="background:#e8443a"></i><i style="background:#9a52e0"></i><i style="background:#9a52e0"></i><i style="background:#f5c43a"></i>
      <i style="background:#4cbf4a"></i><i style="background:#4cbf4a"></i><i style="background:#9a52e0"></i><i style="background:#3a6de8"></i>
    </div>
    <h1 class="logo"><span>블</span><span>록</span> <span>팡</span><span>팡</span></h1>
    <div class="best">👑 <span id="menuBest">0</span></div>
    <div class="modes">
      <div class="mode">
        <div class="lvlsel"><button class="round" id="lvPrev" aria-label="이전 스테이지">◀</button><div class="lvl" id="menuLvl">스테이지 1</div><button class="round" id="lvNext" aria-label="다음 스테이지">▶</button></div>
        <button class="big stage" id="stageBtn">스테이지</button>
        <div class="sub">보석을 모아요 💎⭐❤️</div>
      </div>
      <div class="mode">
        <button class="big endless" id="endlessBtn">무한 모드</button>
        <div class="sub" id="endlessSub">최고 점수에 도전해요</div>
      </div>
    </div>
  </div>

  <div class="layer" id="resBox" hidden>
    <div class="card pop">
      <h2 id="resTitle">더 놓을 곳이 없어요!</h2>
      <p id="resSub">점수</p>
      <div class="num" id="resNum">0</div>
      <div class="new" id="resNew" hidden>🎉 최고 기록!</div>
      <div class="row">
        <button class="gray" id="resHome">처음으로</button>
        <button class="stage" id="resGo">다시 하기</button>
      </div>
    </div>
  </div>

  <div class="layer" id="helpBox" hidden>
    <div class="card pop">
      <h2>게임 방법</h2>
      <div class="rules">
        <div><b>👆</b><span>아래 블록을 손가락으로 끌어서 판에 놓아요.</span></div>
        <div><b>💥</b><span>가로나 세로 한 줄을 꽉 채우면 팡! 터져요.</span></div>
        <div><b>🔥</b><span>계속 터뜨리면 콤보! 점수가 쑥쑥 올라요.</span></div>
        <div><b>💎</b><span>스테이지에서는 보석 블록을 터뜨려 위에 있는 보석을 다 모아요.</span></div>
        <div><b>⛔</b><span>블록을 놓을 곳이 없으면 끝나요.</span></div>
      </div>
      <button class="stage" id="helpOk">알겠어요</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const N=8;
const COLORS=['#e8443a','#f07a2c','#f5c43a','#4cbf4a','#4cc8f0','#3a6de8','#9a52e0'];
const GRAY='#8a90a8';
const GEMS=3; // 0 diamond, 1 star, 2 heart
const K='blocks-';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(K+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(K+k,v)}catch(e){}},del(k){try{localStorage.removeItem(K+k)}catch(e){}}};
let best=parseInt(store.get('best','0'),10)||0;
let maxLevel=Math.max(1,parseInt(store.get('level','1'),10)||1);
let curLevel=Math.min(maxLevel,Math.max(1,parseInt(store.get('cur',String(maxLevel)),10)||maxLevel));
let soundOn=store.get('sound','1')!=='0';

// ---------- shapes ----------
function norm(cells){const mr=Math.min(...cells.map(c=>c[0])),mc=Math.min(...cells.map(c=>c[1]));return cells.map(c=>[c[0]-mr,c[1]-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function rot(cells){return norm(cells.map(([r,c])=>[c,-r]))}
const SHAPES=[];
function addShape(cells,w,rots){let s=norm(cells);const seen=new Set();for(let i=0;i<rots;i++){const key=JSON.stringify(s);if(!seen.has(key)){seen.add(key);SHAPES.push({cells:s,w})}s=rot(s)}}
addShape([[0,0]],2,1);
addShape([[0,0],[0,1]],5,2);
addShape([[0,0],[0,1],[0,2]],5,2);
addShape([[0,0],[0,1],[0,2],[0,3]],3,2);
addShape([[0,0],[0,1],[0,2],[0,3],[0,4]],2,2);
addShape([[0,0],[0,1],[1,0],[1,1]],8,1);
addShape([[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]],2,2);
addShape([[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]],2,1);
addShape([[0,0],[1,0],[1,1]],2.5,4);
addShape([[0,0],[1,0],[2,0],[2,1]],1,4);
addShape([[0,1],[1,1],[2,1],[2,0]],1,4);
addShape([[0,0],[0,1],[0,2],[1,1]],1.2,4);
addShape([[0,0],[0,1],[1,1],[1,2]],1,2);
addShape([[0,1],[0,2],[1,0],[1,1]],1,2);
addShape([[0,0],[1,0],[2,0],[2,1],[2,2]],0.8,4);
const WSUM=SHAPES.reduce((a,s)=>a+s.w,0);
function randShape(){let r=Math.random()*WSUM;for(const s of SHAPES){r-=s.w;if(r<=0)return s}return SHAPES[0]}

// ---------- state ----------
let board=emptyBoard();
let tray=[null,null,null];
let mode='endless'; // 'endless' | 'stage'
let level=1,goals=[];
let score=0,shown=0,combo=0,miss=0;
let phase='menu'; // menu | play | over | win
let drag=null;
const fx=[];
let shake=0;

function emptyBoard(){return Array.from({length:N},()=>Array(N).fill(null))}
function fits(b,cells,r,c){for(const[dr,dc]of cells){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=N||cc>=N||b[rr][cc])return false}return true}
function canPlace(b,cells){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(b,cells,r,c))return true;return false}
function fullLines(b){const rows=[],cols=[];for(let i=0;i<N;i++){if(b[i].every(x=>x))rows.push(i);let f=true;for(let r=0;r<N;r++)if(!b[r][i]){f=false;break}if(f)cols.push(i)}return{rows,cols}}

// simulate: can all pieces of the set be placed in some order? (keeps the game a bit easier than the original)
function solvable(b,set){
  const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  for(const p of perms){
    let bb=b.map(r=>r.map(x=>x?1:0)),ok=true;
    for(const i of p){
      const cells=set[i].cells;let bestPos=null,bestClr=-1;
      for(let r=0;r<N&&bestClr<2;r++)for(let c=0;c<N;c++){
        if(!fits(bb,cells,r,c))continue;
        const t=bb.map(x=>x.slice());for(const[dr,dc]of cells)t[r+dr][c+dc]=1;
        const L=fullLines(t),n=L.rows.length+L.cols.length;
        if(n>bestClr){bestClr=n;bestPos=t;for(const rr of L.rows)t[rr].fill(0);for(const cc of L.cols)for(let k=0;k<N;k++)t[k][cc]=0}
      }
      if(!bestPos){ok=false;break}
      bb=bestPos;
    }
    if(ok)return true;
  }
  return false;
}
function newSet(){
  let set;
  for(let t=0;t<40;t++){set=[randShape(),randShape(),randShape()];if(solvable(board,set))return set}
  for(let t=0;t<40;t++){set=[randShape(),randShape(),randShape()];if(set.some(s=>canPlace(board,s.cells)))return set}
  return [SHAPES[0],randShape(),randShape()];
}
function refill(){
  const set=newSet();
  tray=set.map((s,i)=>{
    const p={cells:s.cells,color:Math.floor(Math.random()*COLORS.length),gem:null,born:now()+i*70};
    if(mode==='stage'){const need=goals.filter(g=>g.left>0);if(need.length&&Math.random()<0.4){p.gem={i:Math.floor(Math.random()*s.cells.length),k:need[Math.floor(Math.random()*need.length)].k}}}
    return p;
  });
}

// ---------- stage setup ----------
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function setupStage(lv){
  const R=rng(lv*7919+13);
  const kinds=lv<3?1:lv<8?2:3;
  const order=[0,1,2].sort(()=>R()-.5).slice(0,kinds).sort();
  goals=order.map(k=>{const n=Math.min(24,3+lv+Math.floor(R()*3));return{k,n,left:n}});
  board=emptyBoard();
  const target=Math.min(30,8+lv*2);
  let filled=0,tries=0;
  while(filled<target&&tries<400){
    tries++;
    const s=SHAPES[Math.floor(R()*SHAPES.length)];
    const r=Math.floor(R()*N),c=Math.floor(R()*N);
    if(!fits(board,s.cells,r,c))continue;
    const col=Math.floor(R()*COLORS.length);
    for(const[dr,dc]of s.cells)board[r+dr][c+dc]={c:col,g:-1};
    const L=fullLines(board);
    if(L.rows.length||L.cols.length){for(const[dr,dc]of s.cells)board[r+dr][c+dc]=null;continue}
    filled+=s.cells.length;
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=board[r][c];if(x&&R()<0.4)x.g=order[Math.floor(R()*order.length)]}
}

// ---------- layout ----------
let W=0,H=0,dpr=1,L={};
function layout(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  const rect=cv.getBoundingClientRect();W=rect.width;H=rect.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const pr=getComputedStyle($('probe'));
  const st=parseFloat(pr.paddingTop)||0,sb=parseFloat(pr.paddingBottom)||0;
  const head=st+64+86;
  const avail=H-head-sb-10;
  const B=Math.floor(Math.min(W-24,avail/1.45,520));
  const cell=B/N;
  const bx=(W-B)/2,by=head;
  const trayTop=by+B+cell*0.5,trayH=Math.max(cell*3.2,Math.min(avail-B-cell*0.5,cell*4));
  L={st,sb,B,cell,bx,by,trayTop,trayH,scoreY:st+64+40,tcell:cell*0.55};
}
window.addEventListener('resize',layout);

// ---------- drawing ----------
function shade(hex,amt){let n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'rgb('+r+','+g+','+b+')'}
const shadeCache={};
function pal(hex){return shadeCache[hex]||(shadeCache[hex]={base:hex,hi:shade(hex,.38),lt:shade(hex,.18),dk:shade(hex,-.32),md:shade(hex,-.18)})}
function drawBlock(x,y,s,hex,alpha){
  const p=pal(hex),b=s*0.13;
  if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.fillStyle=p.base;ctx.fillRect(x,y,s,s);
  ctx.fillStyle=p.hi;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.lineTo(x+s-b,y+b);ctx.lineTo(x+b,y+b);ctx.fill();
  ctx.fillStyle=p.lt;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+b,y+b);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x,y+s);ctx.fill();
  ctx.fillStyle=p.dk;ctx.beginPath();ctx.moveTo(x,y+s);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x+s-b,y+s-b);ctx.lineTo(x+s,y+s);ctx.fill();
  ctx.fillStyle=p.md;ctx.beginPath();ctx.moveTo(x+s,y);ctx.lineTo(x+s,y+s);ctx.lineTo(x+s-b,y+s-b);ctx.lineTo(x+s-b,y+b);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,s-1,s-1);
  if(alpha!=null)ctx.globalAlpha=1;
}
const GEMCOL=['#7fe8ff','#ffe14d','#ff6b8a'];
function gemPath(k,cx,cy,r){
  ctx.beginPath();
  if(k===0){ctx.moveTo(cx-r*.85,cy-r*.25);ctx.lineTo(cx-r*.45,cy-r*.75);ctx.lineTo(cx+r*.45,cy-r*.75);ctx.lineTo(cx+r*.85,cy-r*.25);ctx.lineTo(cx,cy+r*.85);ctx.closePath()}
  else if(k===1){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r*.95;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr+r*.06)}ctx.closePath()}
  else{const y0=cy-r*.35;ctx.moveTo(cx,cy+r*.85);ctx.bezierCurveTo(cx-r*1.15,cy+r*.05,cx-r*.75,cy-r*1.05,cx,y0);ctx.bezierCurveTo(cx+r*.75,cy-r*1.05,cx+r*1.15,cy+r*.05,cx,cy+r*.85);ctx.closePath()}
}
function drawGem(k,cx,cy,r){
  gemPath(k,cx,cy,r);ctx.fillStyle=GEMCOL[k];ctx.fill();
  ctx.lineWidth=Math.max(1.5,r*.14);ctx.strokeStyle='#22305e';ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(cx-r*.28,cy-r*.32,r*.14,0,7);ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function crown(x,y,s){ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.moveTo(x,y+s*.8);ctx.lineTo(x,y+s*.15);ctx.lineTo(x+s*.3,y+s*.45);ctx.lineTo(x+s*.5,y);ctx.lineTo(x+s*.7,y+s*.45);ctx.lineTo(x+s,y+s*.15);ctx.lineTo(x+s,y+s*.8);ctx.closePath();ctx.fill();ctx.fillStyle='#e09a12';ctx.fillRect(x,y+s*.7,s,s*.14)}

function pieceSize(cells){let w=0,h=0;for(const[r,c]of cells){w=Math.max(w,c+1);h=Math.max(h,r+1)}return{w,h}}
function trayCenter(i){return{x:W/2+(i-1)*Math.min(W/3,L.B/3+10),y:L.trayTop+L.trayH/2}}

function now(){return performance.now()}

function render(){
  const t=now();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=0.88;if(shake<.3)shake=0}
  ctx.save();ctx.translate(sx,sy);
  const {bx,by,B,cell}=L;

  // header
  if(phase!=='menu'){
    if(mode==='endless'){
      shown+=(score-shown)*0.18;if(Math.abs(score-shown)<1)shown=score;
      crown(64,L.st+22,24);
      ctx.fillStyle='#ffc83d';ctx.font='26px "Black Han Sans","Do Hyeon",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(String(Math.max(best,score)),96,L.st+33);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='56px "Black Han Sans","Do Hyeon",sans-serif';
      ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowOffsetY=4;
      ctx.fillText(String(Math.round(shown)),W/2,L.scoreY);
      ctx.shadowColor='transparent';ctx.shadowOffsetY=0;
    }else{
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='24px "Do Hyeon",sans-serif';
      ctx.fillText('스테이지 '+level,W/2,L.st+33);
      const gw=92,gap=10,tw=goals.length*gw+(goals.length-1)*gap;
      goals.forEach((g,i)=>{
        const x=W/2-tw/2+i*(gw+gap),y=L.scoreY-24;
        g.px=x+24;g.py=y+24;
        ctx.fillStyle='rgba(20,30,80,.35)';roundRect(x,y,gw,48,24);ctx.fill();
        const bump=g.bump&&t-g.bump<250?1+0.25*Math.sin((t-g.bump)/250*Math.PI):1;
        drawGem(g.k,x+24,y+24,15*bump);
        ctx.textAlign='left';ctx.font='26px "Black Han Sans","Do Hyeon",sans-serif';
        if(g.left>0){ctx.fillStyle='#fff';ctx.fillText(String(g.left),x+46,y+26)}
        else{ctx.fillStyle='#5fe36a';ctx.fillText('✔',x+48,y+26)}
      });
    }
  }

  // board
  ctx.fillStyle='#1c2659';roundRect(bx-6,by-6,B+12,B+12,10);ctx.fill();
  ctx.fillStyle='#232f6b';ctx.fillRect(bx,by,B,B);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(bx+i*cell,by);ctx.lineTo(bx+i*cell,by+B);ctx.moveTo(bx,by+i*cell);ctx.lineTo(bx+B,by+i*cell);ctx.stroke()}

  const pv=drag&&drag.pos?drag:null;
  const hiRows=pv?pv.rows:[],hiCols=pv?pv.cols:[];
  const dragHex=drag?COLORS[tray[drag.i].color]:null;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=board[r][c];if(!x)continue;
    const hl=hiRows.includes(r)||hiCols.includes(c);
    const hex=x.gray?GRAY:hl?dragHex:COLORS[x.c];
    drawBlock(bx+c*cell,by+r*cell,cell,hex);
    if(x.g>=0)drawGem(x.g,bx+c*cell+cell/2,by+r*cell+cell/2,cell*.3);
  }
  // ghost
  if(pv){
    const p=tray[drag.i];
    p.cells.forEach(([dr,dc],j)=>{
      const r=pv.pos[0]+dr,c=pv.pos[1]+dc;
      const hl=hiRows.includes(r)||hiCols.includes(c);
      drawBlock(bx+c*cell,by+r*cell,cell,COLORS[p.color],hl?0.95:0.45);
      if(p.gem&&p.gem.i===j)drawGem(p.gem.k,bx+c*cell+cell/2,by+r*cell+cell/2,cell*.3);
    });
  }

  // clearing cells
  for(const f of fx)if(f.type==='clr'){
    const p=(t-f.t0-f.d)/260;if(p<0){drawBlock(f.x,f.y,cell,f.hex);if(f.g>=0)drawGem(f.g,f.x+cell/2,f.y+cell/2,cell*.3);continue}
    if(p>1)continue;
    const s=cell*(1-p*.9);ctx.globalAlpha=1-p*.6;
    drawBlock(f.x+(cell-s)/2,f.y+(cell-s)/2,s,f.hex);
    ctx.fillStyle='rgba(255,255,255,'+(0.6*(1-p))+')';ctx.fillRect(f.x+(cell-s)/2,f.y+(cell-s)/2,s,s);
    ctx.globalAlpha=1;
  }

  // tray
  for(let i=0;i<3;i++){
    const p=tray[i];if(!p||(drag&&drag.i===i))continue;
    const ps=pieceSize(p.cells),tc=L.tcell,c0=trayCenter(i);
    const ok=canPlace(board,p.cells)&&phase==='play';
    const k=p.born>t?0:Math.min(1,(t-p.born)/220);
    const sc=tc*(k<1?0.4+0.6*easeOut(k):1);
    const x0=c0.x-ps.w*sc/2,y0=c0.y-ps.h*sc/2;
    p.cells.forEach(([r,c],j)=>{
      drawBlock(x0+c*sc,y0+r*sc,sc,ok||phase!=='play'?COLORS[p.color]:GRAY,ok?1:0.6);
      if(p.gem&&p.gem.i===j)drawGem(p.gem.k,x0+c*sc+sc/2,y0+r*sc+sc/2,sc*.32);
    });
  }
  // dragged piece
  if(drag){
    const p=tray[drag.i],s=drag.scale*cell+(1-drag.scale)*L.tcell;
    p.cells.forEach(([r,c],j)=>{
      drawBlock(drag.px+c*s,drag.py+r*s,s,COLORS[p.color]);
      if(p.gem&&p.gem.i===j)drawGem(p.gem.k,drag.px+c*s+s/2,drag.py+r*s+s/2,s*.3);
    });
  }

  // particles, texts, flying gems
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i],age=t-f.t0;
    if(f.type==='clr'){if(age>f.d+300)fx.splice(i,1);continue}
    if(f.type==='pt'){
      if(age<0)continue;
      const a=age/1000;if(a>0.9){fx.splice(i,1);continue}
      const x=f.x+f.vx*a,y=f.y+f.vy*a+600*a*a;
      ctx.globalAlpha=1-a/0.9;ctx.fillStyle=f.hex;ctx.fillRect(x-f.s/2,y-f.s/2,f.s,f.s);ctx.globalAlpha=1;
    }else if(f.type==='txt'){
      const a=age/f.life;if(a>1){fx.splice(i,1);continue}
      const sc=a<0.15?0.5+a/0.15*0.6:a<0.25?1.1-(a-0.15):1;
      ctx.save();ctx.translate(f.x,f.y-a*f.rise);ctx.scale(sc,sc);
      ctx.globalAlpha=a>0.75?1-(a-0.75)/0.25:1;
      ctx.font=f.size+'px "Black Han Sans","Do Hyeon",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=f.size*0.16;ctx.strokeStyle='rgba(30,30,80,.85)';ctx.lineJoin='round';ctx.strokeText(f.s,0,0);
      ctx.fillStyle=f.col;ctx.fillText(f.s,0,0);
      ctx.restore();ctx.globalAlpha=1;
    }else if(f.type==='gem'){
      if(age<0){drawGem(f.k,f.x0,f.y0,cell*.3);continue}
      const a=Math.min(1,age/550),e=easeInOut(a);
      const x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-Math.sin(a*Math.PI)*60;
      drawGem(f.k,x,y,cell*.3*(1-a*0.3));
      if(a>=1){fx.splice(i,1);const g=goals.find(g=>g.k===f.k);if(g)g.bump=t}
    }
  }
  ctx.restore();
  requestAnimationFrame(render);
}
function easeOut(x){return 1-(1-x)*(1-x)}
function easeInOut(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}

// ---------- sound ----------
let ac=null;
function tone(freq,dur,type,vol,delay){
  if(!soundOn)return;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
function sPick(){tone(520,.08,'triangle',.1)}
function sPlace(){tone(220,.12,'square',.07);tone(330,.1,'triangle',.08,.02)}
function sClear(n,cb){const base=[523,659,784,1047,1319,1568];for(let i=0;i<Math.min(6,n+1+Math.min(cb,3));i++)tone(base[i]*(1+Math.min(cb,6)*0.03),.18,'triangle',.12,i*.06)}
function sOver(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'sine',.14,i*.16))}
function sWin(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.11))}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

// ---------- input ----------
function cellAt(px,py){return[Math.round((py-L.by)/L.cell),Math.round((px-L.bx)/L.cell)]}
cv.addEventListener('pointerdown',e=>{
  if(phase!=='play'||drag)return;
  const x=e.clientX-cv.getBoundingClientRect().left,y=e.clientY-cv.getBoundingClientRect().top;
  if(y<L.trayTop-L.cell*0.6)return;
  let bi=-1,bd=1e9;
  for(let i=0;i<3;i++){if(!tray[i])continue;const c=trayCenter(i),d=Math.abs(c.x-x);if(d<bd){bd=d;bi=i}}
  if(bi<0||bd>Math.min(W/3,L.B/3+10)*0.6)return;
  const p=tray[bi];
  drag={i:bi,fx:x,fy:y,scale:0,pos:null,rows:[],cols:[],t0:now(),pid:e.pointerId};
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  sPick();
  moveDrag(x,y);
  e.preventDefault();
});
function moveDrag(x,y){
  const p=tray[drag.i];drag.fx=x;drag.fy=y;
  const ps=pieceSize(p.cells);
  const s=drag.scale*L.cell+(1-drag.scale)*L.tcell;
  drag.px=x-ps.w*s/2;
  drag.py=y-ps.h*s-L.cell*1.3;
  const [r,c]=cellAt(drag.px,drag.py);
  if(fits(board,p.cells,r,c)){
    drag.pos=[r,c];
    const t=board.map(row=>row.slice());for(const[dr,dc]of p.cells)t[r+dr][c+dc]=1;
    const Ls=fullLines(t);drag.rows=Ls.rows;drag.cols=Ls.cols;
  }else{drag.pos=null;drag.rows=[];drag.cols=[]}
}
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const r=cv.getBoundingClientRect();moveDrag(e.clientX-r.left,e.clientY-r.top)});
function endDrag(e){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  if(d.pos)place(d.i,d.pos[0],d.pos[1]);
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid)drag=null});
function growDrag(){if(drag&&drag.scale<1){drag.scale=Math.min(1,drag.scale+0.2);moveDrag(drag.fx,drag.fy)}requestAnimationFrame(growDrag)}

// ---------- rules ----------
const PRAISE=['','','Good!','Great!','Excellent!','Amazing!','Unbelievable!'];
const LINEPTS=[0,80,200,360,560,800,1080,1400];
function place(i,r,c){
  const p=tray[i];
  p.cells.forEach(([dr,dc],j)=>{board[r+dr][c+dc]={c:p.color,g:p.gem&&p.gem.i===j?p.gem.k:-1}});
  tray[i]=null;
  score+=p.cells.length;
  sPlace();buzz(10);
  const {rows,cols}=fullLines(board);
  const n=rows.length+cols.length;
  if(n){
    combo++;miss=0;
    const t0=now(),seen=new Set(),cx=L.bx+(c+pieceSize(p.cells).w/2)*L.cell,cy=L.by+(r+pieceSize(p.cells).h/2)*L.cell;
    const hex=COLORS[p.color];
    const add=(rr,cc,d)=>{const key=rr*N+cc;if(seen.has(key))return;seen.add(key);const x=board[rr][cc];
      const px=L.bx+cc*L.cell,py=L.by+rr*L.cell;
      fx.push({type:'clr',x:px,y:py,hex,g:x.g,t0,d});
      for(let k=0;k<3;k++)fx.push({type:'pt',x:px+L.cell/2,y:py+L.cell/2,vx:(Math.random()-.5)*360,vy:-Math.random()*320-60,s:4+Math.random()*6,hex,t0:t0+d});
      if(x.g>=0&&mode==='stage'){const g=goals.find(g=>g.k===x.g);if(g&&g.left>0){g.left--;fx.push({type:'gem',k:x.g,x0:px+L.cell/2,y0:py+L.cell/2,x1:g.px,y1:g.py,t0:t0+d+80})}}
    };
    for(const rr of rows)for(let k=0;k<N;k++)add(rr,k,Math.abs(k-c)*28);
    for(const cc of cols)for(let k=0;k<N;k++)add(k,cc,Math.abs(k-r)*28);
    for(const rr of rows)board[rr].fill(null);
    for(const cc of cols)for(let k=0;k<N;k++)board[k][cc]=null;
    const pts=Math.round(LINEPTS[Math.min(n,7)]*(1+(combo-1)*0.5));
    score+=pts;
    fx.push({type:'txt',s:'+'+pts,x:cx,y:cy,size:30,col:'#fff',life:900,rise:50,t0});
    if(combo>=2)fx.push({type:'txt',s:'Combo '+combo,x:W/2,y:L.by+L.B*0.38,size:44,col:'#ffd23d',life:1100,rise:30,t0});
    if(n>=2)fx.push({type:'txt',s:PRAISE[Math.min(n,6)],x:W/2,y:L.by+L.B*0.55,size:48,col:'#7ff0ff',life:1200,rise:20,t0:t0+60});
    if(board.every(row=>row.every(x=>!x))){score+=300;fx.push({type:'txt',s:'All Clear! +300',x:W/2,y:L.by+L.B*0.72,size:40,col:'#ff9be0',life:1400,rise:20,t0:t0+150})}
    shake=Math.min(14,4+n*3);
    sClear(n,combo);buzz(25);
  }else{
    miss++;if(miss>=3)combo=0;
  }
  if(tray.every(x=>!x))refill();
  if(mode==='endless'){if(score>best){best=score;store.set('best',best)}saveGame()}
  if(mode==='stage'&&goals.every(g=>g.left<=0)){phase='win';setTimeout(stageWin,900);return}
  if(!tray.some(x=>x&&canPlace(board,x.cells)))gameOver();
}

function gameOver(){
  phase='over';
  if(mode==='endless')store.del('save');
  sOver();buzz([30,60,30]);
  const t0=now();
  // fill board grey row by row from the bottom, like the original
  for(let r=N-1;r>=0;r--)setTimeout(()=>{for(let c=0;c<N;c++){if(board[r][c])board[r][c].gray=true}},(N-1-r)*70);
  setTimeout(()=>{
    if(mode==='endless'){
      $('resTitle').textContent='더 놓을 곳이 없어요!';
      $('resSub').textContent='점수';$('resSub').hidden=false;
      $('resNum').textContent=score;$('resNum').hidden=false;
      $('resNew').hidden=!(score>0&&score>=best&&score>startBest);
    }else{
      $('resTitle').textContent='아쉬워요!';
      $('resSub').textContent='스테이지 '+level+' 다시 해 봐요';$('resSub').hidden=false;
      $('resNum').hidden=true;$('resNew').hidden=true;
    }
    $('resGo').textContent='다시 하기';
    $('resBox').hidden=false;
  },N*70+700);
}
function stageWin(){
  sWin();buzz([20,40,20]);
  if(level>=maxLevel){maxLevel=level+1;store.set('level',maxLevel)}
  curLevel=Math.min(maxLevel,level+1);store.set('cur',curLevel);
  $('resTitle').textContent='스테이지 '+level+' 클리어! 🎉';
  $('resSub').hidden=true;$('resNum').hidden=true;$('resNew').hidden=true;
  $('resGo').textContent='다음 스테이지';
  $('resBox').hidden=false;
}

// ---------- save / start ----------
function saveGame(){
  if(phase!=='play'&&phase!=='over')return;
  store.set('save',JSON.stringify({board,tray:tray.map(p=>p&&{cells:p.cells,color:p.color}),score,combo,miss}));
}
function loadGame(){
  try{const s=JSON.parse(store.get('save','null'));if(!s||!Array.isArray(s.board)||s.board.length!==N)return false;
    board=s.board.map(row=>row.map(x=>x&&{c:x.c,g:-1}));tray=s.tray.map(p=>p&&{cells:p.cells,color:p.color,gem:null,born:0});
    score=s.score|0;combo=s.combo|0;miss=s.miss|0;
    if(tray.every(x=>!x))refill();
    return tray.some(x=>x&&canPlace(board,x.cells));
  }catch(e){return false}
}
let startBest=0;
function startEndless(fresh){
  mode='endless';fx.length=0;drag=null;goals=[];startBest=best;
  if(fresh||!loadGame()){board=emptyBoard();score=0;combo=0;miss=0;refill()}
  shown=score;phase='play';
  hideAll();saveGame();
}
function startStage(lv){
  mode='stage';level=lv;fx.length=0;drag=null;score=0;combo=0;miss=0;
  setupStage(lv);refill();phase='play';hideAll();
}
function hideAll(){$('menu').hidden=true;$('resBox').hidden=true;$('helpBox').hidden=true;$('homeBtn').hidden=false;$('helpBtn').hidden=false}
function showMenu(){
  if(mode==='endless'&&phase==='play')saveGame();
  phase='menu';drag=null;fx.length=0;board=emptyBoard();tray=[null,null,null];
  $('menu').hidden=false;$('resBox').hidden=true;$('homeBtn').hidden=true;
  $('menuBest').textContent=best;
  $('menuLvl').textContent='스테이지 '+curLevel;
  $('lvPrev').disabled=curLevel<=1;$('lvNext').disabled=curLevel>=maxLevel;
  $('endlessSub').textContent=store.get('save',null)?'하던 판을 이어서 해요':'최고 점수에 도전해요';
}
$('lvPrev').onclick=()=>{if(curLevel>1){curLevel--;store.set('cur',curLevel);showMenu()}};
$('lvNext').onclick=()=>{if(curLevel<maxLevel){curLevel++;store.set('cur',curLevel);showMenu()}};
$('stageBtn').onclick=()=>startStage(curLevel);
$('endlessBtn').onclick=()=>startEndless(false);
$('homeBtn').onclick=showMenu;
$('resHome').onclick=showMenu;
$('resGo').onclick=()=>{if(mode==='endless')startEndless(true);else if(phase==='win')startStage(curLevel);else startStage(level)};
$('helpBtn').onclick=()=>{$('helpBox').hidden=false};
$('helpOk').onclick=()=>{$('helpBox').hidden=true};
function syncSound(){$('soundBtn').textContent=soundOn?'🔊':'🔇'}
$('soundBtn').onclick=()=>{soundOn=!soundOn;store.set('sound',soundOn?'1':'0');syncSound();if(soundOn)sPick()};
syncSound();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='endless'&&phase==='play')saveGame()});

// debug hook for automated checks
window.blocksDebug=()=>({phase,mode,level,score,combo,goals:goals.map(g=>({k:g.k,left:g.left})),board:board.map(r=>r.map(x=>x?1:0).join('')),tray:tray.map(p=>p&&p.cells.length),place:(i,r,c)=>{if(tray[i]&&fits(board,tray[i].cells,r,c)){place(i,r,c);return true}return false},
  findMove:()=>{for(let i=0;i<3;i++)if(tray[i])for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(board,tray[i].cells,r,c))return[i,r,c];return null},layout:L});

layout();showMenu();requestAnimationFrame(render);requestAnimationFrame(growDrag);
})();
</script>
