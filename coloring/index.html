<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eaf4ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="색칠놀이">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>알록달록 색칠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Three screens (home, draw, gallery). The draw screen stacks three canvases: paint (bottom), the child's pencil lines, and the outline guide on top. */
:root{
  --bg:#eaf4ff;
  --bg2:#fff4fb;
  --card:#ffffff;
  --ink:#2f3352;
  --muted:#8088a8;
  --accent:#ff6fa8;
  --blue:#4c8dff;
  --shadow:0 5px 0 rgba(47,51,82,.13);
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --c:#ff4d6d;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:var(--H,100%);margin:0}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 env(safe-area-inset-bottom,0px)}

/* ---------- home ---------- */
.top{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:56px}
.top h1{flex:1;margin:0;font-size:clamp(26px,7.5vw,38px);font-weight:400;text-align:center;letter-spacing:1px}
.top h1 span:nth-child(5n+1){color:#ff5d8f}.top h1 span:nth-child(5n+2){color:#ff9f1c}.top h1 span:nth-child(5n+3){color:#2ec27e}.top h1 span:nth-child(5n+4){color:#4c8dff}.top h1 span:nth-child(5n+5){color:#9b5de5}
.round{width:52px;height:52px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:26px;font-family:var(--emoji);flex:none}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(47,51,82,.13)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px 6px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);min-width:68px;font-size:15px}
.tab b{font-family:var(--emoji);font-size:28px;font-weight:400;line-height:1.1}
.tab.on{background:#ffd84d;transform:translateY(-2px)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:6px 16px 24px;align-content:start;-webkit-overflow-scrolling:touch}
.pic{position:relative;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pic:active{transform:scale(.96)}
.pic img{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;display:block}
.pic span{font-size:17px}
.pic .star{position:absolute;top:4px;right:6px;font-size:26px;font-family:var(--emoji);filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.pic.dice{background:linear-gradient(135deg,#b8f2e6,#ffd6ec)}
.pic.dice .big{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:70px;font-family:var(--emoji)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:20px;padding:40px 10px;line-height:1.6}

/* ---------- draw ---------- */
#draw{background:#f3f0ea}
.dbar{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:58px;flex:none}
.dbar .sp{flex:1}
.dbar .round{width:50px;height:50px;font-size:24px}
.dbar .round.off{opacity:.45}
#done{width:auto;padding:0 14px;font-family:var(--body);font-size:20px;background:#ffd84d;gap:4px;display:flex}
#done i{font-style:normal;font-family:var(--emoji)}
@media (max-width:440px){.dbar{gap:6px;padding:0 8px}.dbar .round{width:46px;height:46px;font-size:22px}#done{font-size:0;padding:0 12px}#done i{font-size:26px}}
.work{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:8px;padding:4px 8px 8px}
.stage{min-height:0;display:grid;place-items:center}
.paper{position:relative;background:#fff;border-radius:18px;box-shadow:0 4px 0 rgba(47,51,82,.12),0 0 0 3px #fff;overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#guideCv{transition:opacity .25s}
.colors{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:0 4px;max-width:560px;width:100%;justify-self:center}
.sw{aspect-ratio:1;border-radius:30%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 2px 0 rgba(0,0,0,.08);border:3px solid #fff;max-height:52px}
.sw.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--ink),inset 0 -4px 0 rgba(0,0,0,.15)}
.sw.rain{background:conic-gradient(#ff4d6d,#ffb703,#ffe74c,#3bd16f,#4cc9f0,#4c6fff,#b15cff,#ff4d6d)}
.tools{display:flex;gap:4px;justify-content:space-between;align-items:flex-end;max-width:560px;width:100%;justify-self:center;padding:0 2px}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;transition:transform .15s;min-width:0}
.tool svg{width:100%;max-width:58px;height:auto;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.tool.on{transform:translateY(-10px)}
.tool.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:2px}
.sizes{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;flex:none;width:40px}
.sz{width:36px;height:26px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:#ffd84d}
@media (orientation:portrait) and (min-width:700px){
  .colors,.tools{max-width:720px}
  .tool svg{max-width:76px}
  .sw{max-height:66px}
}
@media (orientation:landscape) and (min-width:600px){
  .work{grid-template-columns:auto 1fr auto;grid-template-rows:minmax(0,1fr);padding:4px 12px 10px}
  .tools{grid-column:1;grid-row:1;flex-direction:column;width:auto;justify-content:center;align-items:flex-start}
  .tools{gap:2px}
  .tool{flex:none;width:100px;height:min(64px,calc((var(--H,100vh) - 110px)/9));display:grid;place-items:center;overflow:visible}
  .tool svg{--h:min(124px,calc((var(--H,100vh) - 110px)/9*1.9));max-width:none;height:var(--h);width:calc(var(--h)*.43);transform:rotate(-90deg)}
  .tool.on{transform:translateX(14px)}
  .tool.on::after{display:none}
  .sizes{flex-direction:row;width:auto;margin-top:10px}
  .stage{grid-column:2;grid-row:1}
  .colors{--s:min(52px,calc((var(--H,100vh) - 110px)/9 - 6px));grid-column:3;grid-row:1;grid-template-columns:repeat(2,var(--s));grid-auto-rows:var(--s);align-content:center;width:auto;min-height:0}
  .sw{max-height:none}
}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(40,40,70,.35);display:grid;place-items:center;z-index:20;padding:20px}
.card{background:#fff;border-radius:30px;padding:24px 22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12);max-width:340px;width:100%}
.card h2{margin:0 0 6px;font-size:30px;font-weight:400}
.card p{margin:0 0 16px;color:var(--muted);font-size:18px}
.card .row{display:flex;gap:12px;justify-content:center}
.bigbtn{flex:1;min-height:64px;border-radius:22px;font-size:24px;background:#eef1f8;box-shadow:var(--shadow)}
.bigbtn.yes{background:#ff6fa8;color:#fff}
.bigbtn.go{background:#4c8dff;color:#fff}
.bigbtn i{font-style:normal;font-family:var(--emoji)}
#doneImg{width:100%;border-radius:20px;margin:6px 0 14px;box-shadow:0 0 0 4px #ffd84d}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:20px;font-size:18px;z-index:40;white-space:nowrap}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen" id="home">
  <div class="top">
    <button class="round" id="soundBtn" aria-label="소리">🔊</button>
    <h1 id="title" aria-label="알록달록 색칠"></h1>
    <button class="round" id="galleryBtn" aria-label="내 그림">🖼️</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <main class="grid" id="grid"></main>
</section>

<!-- GALLERY -->
<section class="screen" id="gallery" hidden>
  <div class="top">
    <button class="round" id="galBack" aria-label="뒤로">⬅️</button>
    <h1>내 그림</h1>
    <span style="width:52px"></span>
  </div>
  <main class="grid" id="galGrid"></main>
</section>

<!-- DRAW -->
<section class="screen" id="draw" hidden>
  <div class="dbar">
    <button class="round" id="homeBtn" aria-label="처음으로">🏠</button>
    <button class="round" id="undoBtn" aria-label="되돌리기">↩️</button>
    <button class="round" id="guideBtn" aria-label="밑그림 진하게">👀</button>
    <button class="round" id="clearBtn" aria-label="다 지우기">🗑️</button>
    <span class="sp"></span>
    <button class="round" id="shareBtn" aria-label="사진으로 저장">📷</button>
    <button class="round" id="done"><i>⭐</i>다 했어요</button>
  </div>
  <div class="work">
    <div class="stage" id="stage">
      <div class="paper" id="paper">
        <canvas id="paintCv"></canvas>
        <canvas id="inkCv"></canvas>
        <canvas id="guideCv"></canvas>
        <canvas id="dotCv"></canvas>
      </div>
    </div>
    <div class="colors" id="colors"></div>
    <div class="tools" id="tools"></div>
  </div>
</section>

<div class="ov" id="clearOv" hidden>
  <div class="card">
    <h2>다 지울까요?</h2>
    <p>그린 그림이 모두 사라져요</p>
    <div class="row">
      <button class="bigbtn" id="clearNo"><i>✖️</i></button>
      <button class="bigbtn yes" id="clearYes"><i>🗑️</i></button>
    </div>
  </div>
</div>
<div class="ov" id="doneOv" hidden>
  <div class="card">
    <h2 id="doneTitle">🎉 멋져요!</h2>
    <img id="doneImg" alt="">
    <div class="row">
      <button class="bigbtn" id="doneMore"><i>🖍️</i> 더 칠하기</button>
      <button class="bigbtn go" id="doneNext"><i>➡️</i> 다른 그림</button>
    </div>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
'use strict';
/* =========================================================
   Storage: small settings in localStorage (coloring-*), drawings in IndexedDB (they are too big for localStorage).
   ========================================================= */
const store={get(k,d){try{const v=localStorage.getItem('coloring-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('coloring-'+k,JSON.stringify(v))}catch(e){}}};
const db={
  _p:null,
  open(){
    if(this._p)return this._p;
    this._p=new Promise(res=>{
      try{
        const r=indexedDB.open('coloring',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('works');
        r.onsuccess=()=>res(r.result);
        r.onerror=()=>res(null);
      }catch(e){res(null)}
    });
    return this._p;
  },
  async op(mode,fn){
    const d=await this.open(); if(!d)return null;
    return new Promise(res=>{
      try{
        const tx=d.transaction('works',mode),st=tx.objectStore('works');
        const rq=fn(st);
        tx.oncomplete=()=>res(rq&&rq.result);
        tx.onerror=tx.onabort=()=>res(null);
      }catch(e){res(null)}
    });
  },
  get(k){return this.op('readonly',s=>s.get(k))},
  put(k,v){return this.op('readwrite',s=>s.put(v,k))},
  del(k){return this.op('readwrite',s=>s.delete(k))},
  async all(){
    const d=await this.open(); if(!d)return [];
    return new Promise(res=>{
      const out=[];
      try{
        const tx=d.transaction('works','readonly');
        const rq=tx.objectStore('works').openCursor();
        rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}};
        tx.oncomplete=()=>res(out);
        tx.onerror=()=>res(out);
      }catch(e){res(out)}
    });
  }
};

/* =========================================================
   Picture library. Every picture is SVG line art on a 400×400 board.
   Lines use stroke="currentColor"-style defaults from the wrapper; filled
   details (pupils, nostrils) use fill="currentColor".
   ========================================================= */
const f=n=>Math.round(n*10)/10;
const C=(x,y,r)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
const E=(x,y,rx,ry,rot)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}"${rot?` transform="rotate(${rot} ${f(x)} ${f(y)})"`:''}/>`;
const R=(x,y,w,h,r=0)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(r)}"/>`;
const P=d=>`<path d="${d}"/>`;
const D=(x,y,r)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="currentColor"/>`;
const DE=(x,y,rx,ry)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="currentColor"/>`;
const L=(...p)=>`<polyline points="${p.map(f).join(' ')}"/>`;
const T=(w,inner)=>`<g stroke-width="${w}">${inner}</g>`;
function heart(cx,cy,s){return `M${f(cx)} ${f(cy+s*.9)} C${f(cx-s*1.7)} ${f(cy-s*.1)} ${f(cx-s*.9)} ${f(cy-s*1.35)} ${f(cx)} ${f(cy-s*.45)} C${f(cx+s*.9)} ${f(cy-s*1.35)} ${f(cx+s*1.7)} ${f(cy-s*.1)} ${f(cx)} ${f(cy+s*.9)} Z`}
function star(cx,cy,R1,r1,n=5,rot=-90){let d='';for(let i=0;i<n*2;i++){const a=(rot+i*180/n)*Math.PI/180,rr=i%2?r1:R1;d+=(i?'L':'M')+f(cx+Math.cos(a)*rr)+' '+f(cy+Math.sin(a)*rr)}return d+'Z'}
function cloud(cx,cy,s){return P(`M${f(cx-50*s)} ${f(cy+20*s)} C${f(cx-75*s)} ${f(cy+20*s)} ${f(cx-75*s)} ${f(cy-15*s)} ${f(cx-48*s)} ${f(cy-12*s)} C${f(cx-45*s)} ${f(cy-42*s)} ${f(cx-5*s)} ${f(cy-45*s)} ${f(cx+5*s)} ${f(cy-22*s)} C${f(cx+20*s)} ${f(cy-40*s)} ${f(cx+55*s)} ${f(cy-30*s)} ${f(cx+50*s)} ${f(cy-5*s)} C${f(cx+78*s)} ${f(cy-5*s)} ${f(cx+78*s)} ${f(cy+22*s)} ${f(cx+50*s)} ${f(cy+20*s)} Z`)}
function bumpy(cx,cy,r,n,amp){let d='';for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,a2=(i+.5)/n*Math.PI*2;if(i===0){d+=`M${f(cx+Math.cos(a)*r)} ${f(cy+Math.sin(a)*r)}`;continue}const ap=(i-.5)/n*Math.PI*2;d+=` Q${f(cx+Math.cos(ap)*(r+amp))} ${f(cy+Math.sin(ap)*(r+amp))} ${f(cx+Math.cos(a)*r)} ${f(cy+Math.sin(a)*r)}`}return d+'Z'}
function smile(cx,cy,w,h){return P(`M${f(cx-w)} ${f(cy)} Q${f(cx)} ${f(cy+h)} ${f(cx+w)} ${f(cy)}`)}
function eyes(cx,cy,gap,r){return D(cx-gap,cy,r)+D(cx+gap,cy,r)+`<circle cx="${f(cx-gap+r*.35)}" cy="${f(cy-r*.35)}" r="${f(r*.32)}" fill="#fff" stroke="none"/><circle cx="${f(cx+gap+r*.35)}" cy="${f(cy-r*.35)}" r="${f(r*.32)}" fill="#fff" stroke="none"/>`}
const ground=(y=360)=>P(`M-10 ${y} Q200 ${y-30} 410 ${y}`);
const sparkle=(x,y,s)=>P(star(x,y,s,s*.38,4,0));

/* --- the alien in a capsule ship (based on 강산님's picture) --- */
function alienShip(){
  return P('M108 232 C108 120 160 72 200 72 C240 72 292 120 292 232')
   +L(184,124,176,98)+C(172,90,10)+L(216,124,224,98)+C(228,90,10)
   +E(200,170,60,52)
   +P(heart(178,160,13))+P(heart(222,160,13))
   +P('M164 184 Q200 236 236 184 Z')+T(5,L(168,188,176,199,184,190,192,201,200,191,208,201,216,190,224,199,232,188))
   +R(94,222,212,24,12)
   +E(166,222,17,11)+E(234,222,17,11)
   +R(112,246,186,92,26)
   +R(132,246,18,92,6)+R(170,246,18,92,6)+R(208,246,18,92,6)+R(246,246,18,92,6)
   +R(78,252,40,80,14)
   +P('M78 272 L40 262 L56 284 L26 294 L56 306 L40 326 L78 314')
   +P('M296 248 C338 248 352 276 352 292 C352 308 338 336 296 336 Z')
   +P('M350 280 L390 292 L350 304')
   +[136,166,196,226,256,286].map(x=>L(x,338,x,366)+C(x,372,8)).join('')
   +sparkle(50,70,14)+sparkle(350,90,11)+C(330,170,5)+C(60,170,5);
}

const PICS={
space:{name:'우주',icon:'🚀',list:[
 {id:'s-ship',name:'외계인 우주선',svg:alienShip},
 {id:'s-rocket',name:'로켓',svg:()=>P('M200 40 C252 88 262 170 256 290 L144 290 C138 170 148 88 200 40 Z')+C(200,150,32)+C(200,150,20)+P('M150 120 L250 120')+P('M147 215 L98 285 L98 322 L146 292')+P('M253 215 L302 285 L302 322 L254 292')+R(166,290,68,24,6)+P('M172 318 Q178 352 200 384 Q222 352 228 318 Z')+P('M188 322 Q192 342 200 358 Q208 342 212 322')+P(star(70,80,20,9))+P(star(332,120,15,7))+C(80,250,30)+E(80,250,48,12,-15)+sparkle(330,250,12)+C(320,330,6)},
 {id:'s-ufo',name:'비행접시',svg:()=>P('M140 190 C140 118 260 118 260 190')+C(200,160,24)+D(191,156,5)+D(209,156,5)+smile(200,166,8,6)+E(200,202,150,44)+E(200,190,100,18)+[110,155,200,245,290].map(x=>C(x,214,10)).join('')+P('M150 246 L104 372 L296 372 L250 246')+P(star(70,70,16,7))+P(star(340,70,12,5))+sparkle(330,330,12)+C(60,320,6)},
 {id:'s-astro',name:'우주인',svg:()=>C(200,128,74)+E(200,132,50,40)+P('M178 112 Q188 104 198 112')+R(140,196,120,112,30)+R(168,222,64,42,8)+C(186,243,8)+C(214,243,8)+R(96,206,44,82,20)+P('M260 214 L300 150 L326 168 L284 236 Z')+C(312,150,18)+R(150,300,42,58,14)+R(208,300,42,58,14)+R(142,344,56,24,10)+R(202,344,56,24,10)+L(312,132,312,60)+P('M312 62 L360 74 L312 92')+P(star(60,70,16,7))+sparkle(60,250,12)},

let soundOn=store.get('sound',true),actx=null;
function beep(freq=600,dur=.08,type='sine',vol=.08,slide=0){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}

  }
  ctx.globalCompositeOperation='source-over';
  ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=w;ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(tool==='crayon')ctx.strokeStyle=crayonPattern(color==='rainbow'?hueBucket():color);
  else ctx.strokeStyle=strokeColor();
  if(tool==='brush'){ctx.shadowBlur=w*.35;ctx.shadowColor=strokeColor();ctx.globalAlpha=.9}
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(mid.x,mid.y,b.x,b.y);ctx.stroke();
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  if(tool==='glitter'){
    const len=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.round(len/6));
    for(let i=0;i<n;i++){
      const tt=Math.random(),x=a.x+(b.x-a.x)*tt+(Math.random()-.5)*w,y=a.y+(b.y-a.y)*tt+(Math.random()-.5)*w;
      ctx.fillStyle=Math.random()<.6?'#ffffff':`hsl(${Math.random()*360},100%,80%)`;
      if(Math.random()<.12){drawSpark(ctx,x,y,4+Math.random()*7)}else{ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x,y,1.2+Math.random()*2.3,0,7);ctx.fill();ctx.globalAlpha=1}
    }
  }
}
function drawSpark(ctx,x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.3:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}

/* ---- paint bucket: fills the outlined area under the finger ---- */
function bucket(px,py){
  px=Math.floor(px);py=Math.floor(py);
  if(px<0||py<0||px>=N||py>=N)return false;
  const inkD=ictx.getImageData(0,0,N,N).data;
  const block=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++)block[i]=wall[i]||inkD[i*4+3]>110?1:0;
  let start=py*N+px;
  if(block[start]){ // tapped on a line: look for the nearest open pixel
    let found=-1;
    for(let r=1;r<14&&found<0;r++)for(let dy=-r;dy<=r&&found<0;dy++)for(let dx=-r;dx<=r;dx++){const x=px+dx,y=py+dy;if(x>=0&&y>=0&&x<N&&y<N&&!block[y*N+x]){found=y*N+x;break}}
    if(found<0)return false;start=found;
  }
  const region=new Uint8Array(N*N),stack=[start];region[start]=1;
  let minX=N,minY=N,maxX=0,maxY=0;
  while(stack.length){
    const p=stack.pop(),x=p%N,y=(p-x)/N;
    if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
    if(x>0&&!region[p-1]&&!block[p-1]){region[p-1]=1;stack.push(p-1)}
    if(x<N-1&&!region[p+1]&&!block[p+1]){region[p+1]=1;stack.push(p+1)}
    if(y>0&&!region[p-N]&&!block[p-N]){region[p-N]=1;stack.push(p-N)}
    if(y<N-1&&!region[p+N]&&!block[p+N]){region[p+N]=1;stack.push(p+N)}
  }
  // grow 4px under the lines so no white seams show next to them
  minX=Math.max(0,minX-5);minY=Math.max(0,minY-5);maxX=Math.min(N-1,maxX+5);maxY=Math.min(N-1,maxY+5);
  const W=maxX-minX+1,H=maxY-minY+1;
  for(let pass=0;pass<4;pass++){
    const add=[];
    for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){const p=y*N+x;if(region[p]||!block[p])continue;
      if((x>0&&region[p-1]===1)||(x<N-1&&region[p+1]===1)||(y>0&&region[p-N]===1)||(y<N-1&&region[p+N]===1))add.push(p)}
    for(const p of add)region[p]=1;
  }
  const img=pctx.getImageData(minX,minY,W,H),d=img.data;
  let rgb;
  if(color!=='rainbow'){const c=hexRGB(color);rgb=()=>c}
  else{const cache={};rgb=(x)=>{const h=Math.round(((x-minX)/W)*300/6)*6;return cache[h]||(cache[h]=hslRGB(h,95,58))}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!region[(y+minY)*N+x+minX])continue;
    const c=rgb(x+minX),i=(y*W+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
  }
  pctx.globalCompositeOperation='source-over';
  pctx.putImageData(img,minX,minY);
  return true;
}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function hslRGB(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),fn=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(fn(0)*255),Math.round(fn(8)*255),Math.round(fn(4)*255)]}

/* ---- pointer input (one finger at a time) ---- */
const paper=$('paper');
let pid=null,last=null,lastMid=null;
function toCanvas(e){const r=paper.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*N,y:(e.clientY-r.top)/r.height*N}}
paper.addEventListener('pointerdown',e=>{
  if(pid!==null||!cur)return;
  e.preventDefault();
  const p=toCanvas(e);
  if(tool==='trace'){
    if(!trace||trace.e>=trace.strokes.length){beep(300,.1);return}
    const st=trace.strokes[trace.e],q=st.pts[trace.i];
    if(Math.hypot(p.x-q[0],p.y-q[1])>TRACE_START){beep(260,.12,'triangle',.07);hintT=performance.now();return}
    pid=e.pointerId;try{paper.setPointerCapture(pid)}catch(_){}
    snap('i');traceMove(p);return;
  }
  if(tool==='fill'){
    snap('p');
    if(bucket(p.x,p.y)){beep(380,.14,'sine',.1,1.8);if(color==='rainbow')hue+=40;markDirty()}else undoStack.pop();
    return;
  }
  pid=e.pointerId;try{paper.setPointerCapture(pid)}catch(_){}
  snap(TOOLS[tool].erase?'both':TOOLS[tool].ink?'i':'p');
  last=p;lastMid=p;
  seg(p,{x:p.x+.1,y:p.y+.1},p);
});
paper.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid)return;
  if(tool==='trace'){traceMove(toCanvas(e));return}
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
    const p=toCanvas(ev);
    if(Math.hypot(p.x-last.x,p.y-last.y)<2)continue;
    const mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
    if(color==='rainbow')hue+=Math.hypot(p.x-last.x,p.y-last.y)*.35;
    seg(lastMid,mid,last);
    lastMid=mid;last=p;
  }
});
function endStroke(e){if(e.pointerId!==pid)return;if(tool==='trace'){pid=null;markDirty();return}if(last)seg(lastMid,last,last);pid=null;last=null;markDirty()}
paper.addEventListener('pointerup',endStroke);
paper.addEventListener('pointercancel',endStroke);

/* ---- number-dot tracing: the finger only steers, the line follows the outline exactly ---- */
const S=N/400,TRACE_START=60*S,TRACE_NEAR=55*S;
let trace=null,hintT=0;
function buildTrace(pic){
  const host=document.createElementNS('http://www.w3.org/2000/svg','svg');
  host.setAttribute('viewBox','0 0 400 400');host.setAttribute('width','400');host.setAttribute('height','400');
  host.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden';
  host.innerHTML=svgCache[pic.id]||(svgCache[pic.id]=pic.svg());
  document.body.appendChild(host);
  const raw=[],filled=[];
  host.querySelectorAll('path,circle,ellipse,rect,polyline,line').forEach(el=>{
    const fl=el.getAttribute('fill');
    if(fl&&fl!=='none'){filled.push(el.outerHTML);return}
    let len=0;try{len=el.getTotalLength()}catch(e){return}
    if(!(len>1))return;
    let m=null;try{if(el.transform&&el.transform.baseVal.numberOfItems)m=el.transform.baseVal.consolidate().matrix}catch(e){}
    const n=Math.max(2,Math.ceil(len/2));let curP=[],prev=null;
    for(let k=0;k<=n;k++){
      let pt=el.getPointAtLength(len*k/n);
      if(m)pt=pt.matrixTransform(m);
      const q=[pt.x*S,pt.y*S];
      if(prev&&Math.hypot(q[0]-prev[0],q[1]-prev[1])>8*S){if(curP.length>1)raw.push(curP);curP=[]}
      curP.push(q);prev=q;
    }
    if(curP.length>1)raw.push(curP);
  });
  host.remove();
  const strokes=raw.map(pts=>{
    const cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
    const L=cum[cum.length-1],nd=Math.max(1,Math.min(9,Math.round(L/(65*S))));
    const dots=[];let k=0;
    for(let d=0;d<=nd;d++){const tg=L*d/nd;while(k<pts.length-1&&cum[k]<tg)k++;dots.push(k)}
    return{pts,dots};
  });
  return{strokes,filled,e:0,i:0};
}
function traceColor(){if(color==='rainbow')return `hsl(${hue%360},95%,50%)`;if(color==='#ffffff'||color==='#f1c27d'||color==='#ffd60a')return'#2b2b3a';return color}
function traceMove(p){
  const t=trace;if(!t||t.e>=t.strokes.length)return;
  let st=t.strokes[t.e],moved=false;
  for(let guard=0;guard<200;guard++){
    const end=Math.min(st.pts.length-1,t.i+30);
    let best=-1,bd=1e9;
    for(let j=t.i+1;j<=end;j++){const q=st.pts[j],d=Math.hypot(p.x-q[0],p.y-q[1]);if(d<bd){bd=d;best=j}}
    if(best<0||bd>TRACE_NEAR)break;
    // only move forward when the finger is ahead of the current point
    const q0=st.pts[t.i];if(Math.hypot(p.x-q0[0],p.y-q0[1])<=bd&&best<end)break;
    // draw the exact outline piece
    ictx.globalCompositeOperation='source-over';ictx.lineCap=ictx.lineJoin='round';ictx.lineWidth=7.5*S;ictx.strokeStyle=traceColor();
    ictx.beginPath();ictx.moveTo(...st.pts[t.i]);for(let j=t.i+1;j<=best;j++)ictx.lineTo(...st.pts[j]);ictx.stroke();
    if(color==='rainbow')hue+=(best-t.i)*1.5;
    const passed=st.dots.findIndex(d=>d>t.i&&d<=best);
    if(passed>0)beep(520+passed*70,.09,'triangle',.08);
    t.i=best;moved=true;
    if(t.i>=st.pts.length-1){
      t.e++;t.i=0;beep(880,.12,'triangle',.09,1.4);
      if(t.e>=t.strokes.length){finishTrace();break}
      st=t.strokes[t.e];
      const q=st.pts[0];if(Math.hypot(p.x-q[0],p.y-q[1])>TRACE_NEAR)break; // next line starts elsewhere
    }
  }
  if(moved)drawDots();
}
async function finishTrace(){
  pid=null;
  const pic=cur;
  if(trace.filled.length){
    const doc=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="${N}" height="${N}"><g color="#2b2b3a" stroke="none">${trace.filled.join('')}</g></svg>`;
    const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(doc));
    if(img&&cur===pic){ictx.globalCompositeOperation='source-over';ictx.drawImage(img,0,0,N,N)}
  }
  cheer();toast('✏️ 다 그렸어요! 이제 색칠해요 🎨');
  tool='fill';renderTools();drawDots();markDirty();
}
function drawDots(){
  dctx.clearRect(0,0,N,N);
  if($('draw').hidden||tool!=='trace'||!trace||trace.e>=trace.strokes.length)return;
  const st=trace.strokes[trace.e],now=performance.now();
  // the rest of this line as a soft dashed path
  dctx.save();dctx.lineCap=dctx.lineJoin='round';dctx.setLineDash([2*S,9*S]);dctx.lineWidth=5*S;dctx.strokeStyle='rgba(255,90,150,.85)';
  dctx.beginPath();dctx.moveTo(...st.pts[trace.i]);for(let j=trace.i+1;j<st.pts.length;j++)dctx.lineTo(...st.pts[j]);dctx.stroke();dctx.restore();
  const next=st.dots.findIndex(d=>d>trace.i);
  const pulse=1+Math.sin(now/180)*.12;
  const hint=now-hintT<900;
  for(let d=st.dots.length-1;d>=0;d--){
    const k=st.dots[d];
    if(k<trace.i||(k===trace.i&&trace.i>0&&d!==0))continue;
    if(d===0&&trace.i>0)continue;
    const [x,y]=st.pts[k],isStart=d===0,isNext=d===next;
    const r=(isStart?17:13)*S*(isStart||isNext?pulse:1)*(isStart&&hint?1.35:1);
    dctx.beginPath();dctx.arc(x,y,r,0,7);dctx.fillStyle=isStart?'#3bd16f':'#fff';dctx.fill();
    dctx.lineWidth=3*S;dctx.strokeStyle=isNext?'#ff4d8d':'#2b2b3a';dctx.stroke();
    dctx.fillStyle=isStart?'#fff':'#2b2b3a';dctx.font=`${Math.round((isStart?18:15)*S)}px Jua,sans-serif`;dctx.textAlign='center';dctx.textBaseline='middle';
    dctx.fillText(String(d+1),x,y+1*S);
  }
  if(trace.i>0){const [x,y]=st.pts[trace.i];dctx.beginPath();dctx.arc(x,y,11*S*pulse,0,7);dctx.fillStyle=traceColor();dctx.fill();dctx.lineWidth=3*S;dctx.strokeStyle='#fff';dctx.stroke()}
}
(function dotLoop(){if(tool==='trace'&&trace&&!$('draw').hidden)drawDots();requestAnimationFrame(dotLoop)})();

/* ---- saving ---- */
function markDirty(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1200)}
function isBlank(ctx){const d=ctx.getImageData(0,0,N,N).data;for(let i=3;i<d.length;i+=4*97)if(d[i])return false;return true}
function composite(sz,withGuide=true){
  const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,sz,sz);x.drawImage(paintCv,0,0,sz,sz);x.drawImage(inkCv,0,0,sz,sz);
  if(withGuide){x.globalAlpha=guideStrong?1:.3;x.drawImage(guideCv,0,0,sz,sz);x.globalAlpha=1}
  return c;
}
async function saveNow(extra){
  clearTimeout(saveTimer);
  if(!cur||(!dirty&&!extra))return;
  const id=cur.id;dirty=false;
  const prev=works[id]||{};
  if(isBlank(pctx)&&isBlank(ictx)&&!prev.done&&!(trace&&trace.e>0)){await db.del(id);delete works[id];return}
  const rec={paint:paintCv.toDataURL('image/png'),ink:inkCv.toDataURL('image/png'),thumb:composite(300).toDataURL('image/jpeg',.85),t:Date.now(),done:!!(prev.done||(extra&&extra.done)),trace:trace?{e:trace.e,i:trace.i}:null};
  works[id]={thumb:rec.thumb,done:rec.done,t:rec.t};
  await db.put(id,rec);
}
$('homeBtn').onclick=async()=>{beep(600,.07);await saveNow();cur=null;show('home');renderTabs();renderGrid()};
$('clearBtn').onclick=()=>{beep(500,.07);$('clearOv').hidden=false};
$('clearNo').onclick=()=>{beep(500,.07);$('clearOv').hidden=true};
$('clearYes').onclick=()=>{snap('both');pctx.clearRect(0,0,N,N);ictx.clearRect(0,0,N,N);if(trace){trace.e=0;trace.i=0;tool='trace';renderTools();drawDots()}beep(300,.2,'sine',.08,.5);$('clearOv').hidden=true;markDirty()};

/* share / save as photo */
async function shareImage(){
  const c=composite(1000);
  const name=(cur?cur.name:'그림')+'.png';
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('📷 그림을 저장했어요');
}
$('shareBtn').onclick=()=>{beep(700,.07);shareImage()};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* done! */
$('done').onclick=async()=>{
  cheer();
  await saveNow({done:true});
  $('doneImg').src=composite(600).toDataURL('image/jpeg',.9);
  $('doneTitle').textContent='🎉 '+(cur?cur.name:'')+' 완성!';
  $('doneOv').hidden=false;confetti();
};
$('doneMore').onclick=()=>{beep(600,.07);$('doneOv').hidden=true};
$('doneNext').onclick=()=>{beep(600,.07);$('doneOv').hidden=true;cur=null;show('home');renderTabs();renderGrid()};

function confetti(){
  const cv=$('confetti');cv.hidden=false;const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#ff4d6d','#ffd60a','#2ec27e','#4cc9f0','#7b2cbf','#ff9f1c'];
  const ps=[...Array(120)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,c:cols[Math.floor(Math.random()*6)],s:6+Math.random()*6}));
  let t=0;
  (function fr(){
    x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}
    if(++t<110)requestAnimationFrame(fr);else{cv.hidden=true}
  })();
}

document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
addEventListener('pagehide',()=>saveNow());
document.addEventListener('gesturestart',e=>e.preventDefault());
function setH(){document.documentElement.style.setProperty('--H',innerHeight+'px');if(!$('draw').hidden)layout()}
setH();addEventListener('resize',setH);if(window.visualViewport)visualViewport.addEventListener('resize',setH);

/* debug hooks for automated checks */
window.coloringDebug={openDraw,getTrace:()=>trace,traceMove,bucket:(x,y,c)=>{color=c;return bucket(x*N/400,y*N/400)},setTool:t=>{tool=t},setColor:c=>{color=c},composite,PICS,THEMES,makeAlien,getPic,svgURL,save:saveNow};

(async()=>{await loadWorks();renderTabs();renderGrid()})();
</script>
