<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bde8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="구멍먹보">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>구멍 먹보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap">
<style>
/* Layout: the 3D city fills the frame; menu, result, shop and help cards float over the live scene. */
:root{
  --sky:#bde8ff;
  --ink:#2a2147;
  --muted:#6c6488;
  --purple:#7b5cff;
  --green:#3fbf55;
  --gold:#ffc23d;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:560px;margin:0 auto}
.wrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
canvas#cv,canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#cv{pointer-events:none}
[hidden]{display:none!important}
.top{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;display:flex;align-items:center;gap:10px;padding:0 12px;pointer-events:none}
.pill{height:44px;display:inline-flex;align-items:center;gap:6px;border-radius:22px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(90,130,190,.35);font-family:var(--display);font-size:20px;padding:0 16px;white-space:nowrap}
.timer{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;min-width:92px;justify-content:center}
.timer.hurry{color:#ff4f5e}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f2b01e);box-shadow:inset 0 0 0 2px #d99a12;flex:none}
.spacer{flex:1}
.board{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 66px);left:12px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.row{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);border-radius:999px;padding:3px 10px 3px 4px;font-family:var(--display);font-size:15px;min-width:118px}
.row b{width:20px;height:20px;border-radius:50%;background:#e9e4f5;display:grid;place-items:center;font-weight:400;font-size:13px}
.row i{width:14px;height:14px;border-radius:50%;background:#222;box-shadow:0 0 0 3px var(--c);flex:none;margin:0 3px}
.row span{flex:1}
.row em{font-style:normal;color:var(--muted)}
.row.me{background:#fff;box-shadow:0 0 0 2px var(--purple)}
.goal{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 68px);left:16px;right:16px;display:flex;align-items:center;gap:10px;pointer-events:none}
.bar{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.8);position:relative;box-shadow:inset 0 0 0 2px #fff}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,#7ed957,#3fbf55)}
.bar b{position:absolute;top:-8px;width:4px;height:34px;margin-left:-2px;background:var(--ink);border-radius:2px}
.bar b::after{content:"🏁";position:absolute;top:-24px;left:-8px;font-size:20px}
.goal span{font-family:var(--display);font-size:22px;background:#fff;border-radius:999px;padding:2px 12px}
button{font-family:var(--display);font-size:22px;color:#fff;background:var(--purple);border:0;border-radius:16px;padding:12px 34px;box-shadow:0 5px 0 #5236c4;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #5236c4}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.4}
button.round{width:44px;height:44px;padding:0;border-radius:50%;background:#fff;color:var(--ink);font-size:26px;box-shadow:0 4px 0 rgba(90,130,190,.35);flex:none}
.layer{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 66px) 16px calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:none;background:linear-gradient(rgba(189,232,255,.6),rgba(189,232,255,0) 32%,rgba(189,232,255,0) 68%,rgba(189,232,255,.65))}
.layer>*{pointer-events:auto}
.logo{font-family:"Black Han Sans",var(--display);font-weight:400;font-size:58px;line-height:1;margin:4px 0 0;color:#4a3b8f;text-shadow:0 5px 0 #2a1f5c,0 9px 14px rgba(40,30,90,.25);letter-spacing:.02em;pointer-events:none;text-align:center}
.logo b{font-weight:400;color:#6ccf3a;text-shadow:0 5px 0 #3f8f1c,0 9px 14px rgba(40,110,30,.25)}
.lvlsel{display:flex;align-items:center;gap:10px;margin-top:14px}
.lvl{font-family:var(--display);font-size:22px;color:var(--ink);background:rgba(255,255,255,.9);border-radius:999px;padding:6px 18px;min-width:96px;text-align:center;pointer-events:none}
.mode{margin-top:10px;font-size:18px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px;pointer-events:none}
.grow{flex:1;pointer-events:none}
.startbtn{font-size:32px;letter-spacing:.1em;padding:14px 70px;margin-bottom:12px;background:var(--green);box-shadow:0 5px 0 #24823a}
.startbtn:active{box-shadow:0 2px 0 #24823a}
.upbtn{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(90,130,190,.45);font-size:20px;padding:8px 22px;display:inline-flex;align-items:center;gap:8px}
.upbtn:active{box-shadow:0 2px 0 rgba(90,130,190,.45)}
.upbtn canvas{width:34px;height:34px}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(189,232,255,.6)}
.card{background:#fff;border-radius:30px;padding:22px 18px 22px;box-shadow:0 12px 40px rgba(60,90,150,.25);width:min(340px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card h2{font-family:var(--display);font-weight:400;font-size:36px;margin:0}
.card p{margin:0;color:var(--muted);font-size:18px;line-height:1.5}
.earn{display:inline-flex;gap:8px;align-items:center;font-family:var(--display);font-size:32px}
.earn .coin{width:28px;height:28px}
.ranks{display:flex;flex-direction:column;gap:6px;width:100%}
.ranks .row{font-size:18px;padding:5px 14px 5px 6px;background:#f4f1fb}
.ranks .row b{width:26px;height:26px;font-size:16px}
.ranks .row.me{background:#efe9ff}
.rules{display:flex;flex-direction:column;gap:12px;text-align:left;font-size:18px;width:100%}
.rules div{display:flex;gap:12px;align-items:center}
.rules .ic{width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:40px;background:#eef6ff;border-radius:16px}
.rules canvas{width:56px;height:56px}
.ok{background:var(--green);box-shadow:0 5px 0 #24823a}
.ok:active{box-shadow:0 2px 0 #24823a}
.ghost{background:#f0eef8;color:var(--ink);box-shadow:0 5px 0 #d6d0ea}
.ghost:active{box-shadow:0 2px 0 #d6d0ea}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;background:#f2f7ff;color:var(--ink);border-radius:18px;padding:6px 4px 8px;box-shadow:0 4px 0 rgba(90,130,190,.35);font-family:var(--body);font-size:15px}
.skin:active{box-shadow:0 1px 0 rgba(90,130,190,.35)}
.skin.on{box-shadow:0 0 0 3px var(--purple),0 4px 0 rgba(90,130,190,.35);background:#efe9ff}
.skin canvas{width:72px;height:72px}
.skin .c{display:inline-flex;gap:4px;align-items:center;background:var(--green);color:#fff;border-radius:999px;padding:2px 10px;font-family:var(--display);font-size:16px}
.skin .c .coin{width:14px;height:14px}
.skin.poor .c{background:#c2bad3}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="app">
  <div class="wrap" id="wrap"><canvas id="gl"></canvas><canvas id="cv"></canvas></div>

  <div class="top">
    <button class="round" id="helpBtn" aria-label="게임 방법">?</button>
    <span class="pill timer" id="timer" hidden>2:00</span>
    <span class="spacer"></span>
    <span class="pill"><i class="coin"></i><span id="coinTxt">0</span></span>
  </div>
  <div class="board" id="board" hidden></div>
  <div class="goal" id="goal" hidden><div class="bar"><i id="goalFill"></i><b id="goalMark"></b></div><span id="goalTxt">0%</span></div>

  <div class="layer" id="menu">
    <h1 class="logo">구멍 <b>먹보</b></h1>
    <div class="lvlsel"><button class="round" id="lvPrev" aria-label="이전 레벨">◀</button><div class="lvl" id="menuLvl">레벨 1</div><button class="round" id="lvNext" aria-label="다음 레벨">▶</button></div>
    <div class="mode" id="menuMode">친구들보다 크게 커져요!</div>
    <div class="grow"></div>
    <button class="startbtn" id="startBtn">시작!</button>
    <button class="upbtn" id="skinBtn"><canvas id="skinIc" width="80" height="80"></canvas>구멍 꾸미기</button>
  </div>

  <div class="overlay" id="resBox" hidden>
    <div class="card">
      <h2 id="resTitle" class="pop">1등!</h2>
      <p id="resMsg"></p>
      <div class="ranks" id="resRanks"></div>
      <div class="earn"><i class="coin"></i>+<span id="resCoins">0</span></div>
      <div class="btns">
        <button class="ghost" id="homeBtn">처음으로</button>
        <button class="ok" id="againBtn">다음 레벨</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="skinBox" hidden>
    <div class="card">
      <h2>구멍 꾸미기</h2>
      <p>누르면 바로 바뀌어요</p>
      <div class="skins" id="skinList"></div>
      <button class="ok" id="skinOk">다 했어요</button>
    </div>
  </div>

  <div class="overlay" id="helpBox" hidden>
    <div class="card">
      <h2>게임 방법</h2>
      <div class="rules">
        <div><span class="ic">👆</span><span>화면에 손가락을 대고 끌면 구멍이 따라 움직여요.</span></div>
        <div><canvas id="helpHole" width="120" height="120"></canvas><span>구멍보다 작은 건 쏙! 하고 빠져요.</span></div>
        <div><span class="ic">🏠</span><span>많이 먹으면 구멍이 커져서 자동차, 집, 빌딩도 먹을 수 있어요.</span></div>
        <div><span class="ic">👑</span><span>시간이 끝났을 때 가장 큰 구멍이 1등이에요.</span></div>
        <div><span class="ic">🏁</span><span>혼자 하는 레벨은 깃발까지 도시를 먹으면 성공!</span></div>
      </div>
      <button class="ok" id="helpOk">알겠어요</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from './three.module.min.js';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,k){const c=new THREE.Color(hex);if(k>0)c.lerp(new THREE.Color('#ffffff'),k);else c.lerp(new THREE.Color('#000000'),-k);return '#'+c.getHexString();}

// ---------- save ----------
const K='hole-';
const SKINS=[
  {id:'monster',name:'괴물 입',cost:0},
  {id:'basic',name:'기본',cost:0},
  {id:'cat',name:'고양이',cost:100},
  {id:'flower',name:'꽃',cost:150},
  {id:'rainbow',name:'무지개',cost:200},
  {id:'star',name:'별',cost:300},
];
let level=1,best=1,coins=0,skin='monster',owned=['monster','basic'];
try{
  best=Math.max(1,parseInt(localStorage.getItem(K+'level')||'1',10)||1);
  level=Math.min(best,Math.max(1,parseInt(localStorage.getItem(K+'cur')||String(best),10)||best));
  coins=Math.max(0,parseInt(localStorage.getItem(K+'coins')||'0',10)||0);
  const o=JSON.parse(localStorage.getItem(K+'skins')||'[]');if(Array.isArray(o))o.forEach(s=>{if(SKINS.some(k=>k.id===s)&&!owned.includes(s))owned.push(s);});
  const s=localStorage.getItem(K+'skin');if(s&&owned.includes(s))skin=s;
}catch(e){}
function save(){try{localStorage.setItem(K+'level',best);localStorage.setItem(K+'cur',level);localStorage.setItem(K+'coins',coins);localStorage.setItem(K+'skins',JSON.stringify(owned));localStorage.setItem(K+'skin',skin);}catch(e){}}

// ---------- rules ----------
// Holes slide over a flat city (y=0). Anything whose fit size is under 90% of a hole's radius and whose centre is inside the hole drops in.
// Points grow the hole in steps (the ring around your hole fills, then it gets bigger). Holes never eat each other here.
const TIME=120;
const R0=.5,MAXLV=14;
const radOf=l=>R0*Math.pow(1.17,Math.min(l,MAXLV));
const need=l=>Math.round(6*Math.pow(1.45,l));
const speedOf=r=>2.8+r*.8;           // world units per second, slower than the original
const FIT=.9;
const isSolo=lv=>lv%3===0;
const soloGoal=lv=>Math.round(Math.min(50,18+lv*1.5));
const rivalsOf=lv=>Math.min(5,3+Math.floor((lv-1)/3));
const NAMES=['토끼','곰돌이','펭귄','여우','판다','고양이','강아지','다람쥐','병아리','코알라','햄스터','돌고래','사자','오리'];
const HCOL=['#ff5a5a','#4d8dff','#ffb81c','#b07bff','#ff7ad1','#22c3b5','#ff8c3a'];
const ME_COL='#7b5cff';

// ---------- 3D scene ----------
const gl=$('gl'),cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');
const renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,stencil:true});
renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));
const scene=new THREE.Scene();
scene.background=new THREE.Color('#bde8ff');
scene.fog=new THREE.Fog('#bde8ff',30,70);
const cam=new THREE.PerspectiveCamera(50,1,.1,300);
scene.add(new THREE.HemisphereLight('#ffffff','#9db08a',2.1));
const sun=new THREE.DirectionalLight('#fff6e8',1.9);sun.position.set(5,12,7);scene.add(sun);
let VW=360,VH=640;
function resize(){
  const d=Math.min(2,window.devicePixelRatio||1);
  VW=wrap.clientWidth;VH=wrap.clientHeight;cv.width=VW*d;cv.height=VH*d;ctx.setTransform(d,0,0,d,0,0);
  renderer.setSize(VW,VH,false);cam.aspect=VW/VH;cam.fov=VW/VH<.62?56:48;cam.updateProjectionMatrix();
}

// Every city thing is one merged mesh with baked vertex colours, so the whole city is one draw call per object.
const MAT=new THREE.MeshLambertMaterial({vertexColors:true});
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const C=(rt,rb,h,s=10)=>new THREE.CylinderGeometry(rt,rb,h,s);
const S=(r)=>new THREE.SphereGeometry(r,12,8);
const Kc=(r,h,s=8)=>new THREE.ConeGeometry(r,h,s);
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_m=new THREE.Matrix4(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function P(geo,col,x=0,y=0,z=0,o={}){
  const g=geo.index?geo.toNonIndexed():geo;geo!==g&&geo.dispose();
  g.deleteAttribute('uv');
  _e.set(o.rx||0,o.ry||0,o.rz||0);_q.setFromEuler(_e);_p.set(x,y,z);_s.set(o.sx||1,o.sy||1,o.sz||1);
  g.applyMatrix4(_m.compose(_p,_q,_s));
  const c=new THREE.Color(col),n=g.attributes.position.count,a=new Float32Array(n*3);
  for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
  g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;
}
function M(parts){
  let n=0;parts.forEach(p=>n+=p.attributes.position.count);
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
  for(const p of parts){pos.set(p.attributes.position.array,o*3);nor.set(p.attributes.normal.array,o*3);col.set(p.attributes.color.array,o*3);o+=p.attributes.position.count;p.dispose();}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeBoundingSphere();return g;
}

const SHIRTS=['#ff6b6b','#4db6ff','#ffd23d','#7ed957','#b07bff','#ff9a4d'];
const CARS=['#ff5a5a','#4d8dff','#ffd23d','#3fbf55','#ffffff','#ff8ad8'];
const ROOFS=['#e8505b','#4d7dff','#f39c3d','#8a5cd6'];
const WALLS=['#fff3d6','#ffe0e6','#e2f0ff','#e8ffe0'];
const BLD=['#9fb7d9','#c9b6e4','#f0c987','#a8d8c8','#e6a3a3'];
function wheels(a,xs,zs,r){for(const x of xs)for(const z of zs)a.push(P(C(r,r,.12,10),'#2a2a33',x,r,z,{rx:Math.PI/2}));}
// size = how big a hole must be (radius/0.9) to swallow it; pts = how much it grows you
const TYPES={
  person:{size:.18,pts:1,vars:6,build:v=>M([P(C(.11,.13,.36),SHIRTS[v],0,.18,0),P(S(.1),'#ffd6b0',0,.46,0),P(C(.105,.105,.06),'#5a3a22',0,.55,0)])},
  cone:{size:.15,pts:1,vars:1,build:()=>M([P(B(.3,.04,.3),'#ff7a1a',0,.02,0),P(Kc(.12,.38),'#ff7a1a',0,.21,0),P(C(.075,.09,.06),'#ffffff',0,.2,0)])},
  hydrant:{size:.15,pts:1,vars:1,build:()=>M([P(C(.1,.11,.32),'#ff4a4a',0,.16,0),P(S(.1),'#ff4a4a',0,.32,0),P(C(.04,.04,.3,6),'#d93636',0,.2,0,{rz:Math.PI/2})])},
  bin:{size:.2,pts:1,vars:1,build:()=>M([P(C(.17,.14,.42),'#3fae5a',0,.21,0),P(C(.19,.19,.05),'#2d8a45',0,.44,0)])},
  bench:{size:.4,pts:2,vars:1,build:()=>M([P(B(.9,.07,.3),'#c98a4b',0,.26,0),P(B(.9,.25,.06),'#c98a4b',0,.45,-.13),P(B(.06,.26,.26),'#555c66',-.38,.13,0),P(B(.06,.26,.26),'#555c66',.38,.13,0)])},
  bush:{size:.36,pts:2,vars:1,build:()=>M([P(S(.36),'#4fb848',0,.28,0,{sy:.8}),P(S(.22),'#63c95a',.18,.38,.08)])},
  lamp:{size:.24,pts:2,vars:1,build:()=>M([P(C(.05,.07,1.6,6),'#5a6170',0,.8,0),P(S(.14),'#fff3a0',0,1.65,0),P(C(.12,.12,.06,8),'#5a6170',0,1.76,0)])},
  tree:{size:.55,pts:4,vars:2,build:v=>v?M([P(C(.1,.13,.6,6),'#8a5a32',0,.3,0),P(Kc(.55,1.3,8),'#2f9e4f',0,1.15,0),P(Kc(.42,.9,8),'#3cb85d',0,1.6,0)])
    :M([P(C(.1,.13,.7,6),'#8a5a32',0,.35,0),P(S(.55),'#4fc25a',0,1.05,0),P(S(.35),'#66d36a',.25,1.3,.15)])},
  car:{size:.66,pts:6,vars:6,build:v=>{const c=CARS[v],a=[P(B(1.7,.42,.86),c,0,.33,0),P(B(.9,.36,.76),'#bfe6ff',-.05,.7,0),P(B(.94,.07,.8),c,-.05,.9,0)];wheels(a,[-.55,.55],[-.43,.43],.17);return M(a);}},

const GEO={};

// ---------- city ----------
// Roads run every BL units along x and z; each block between them is a park, houses, shops or downtown.
const BL=12,ROAD=3.6,BH=(BL-ROAD)/2; // BH = half width of a block
let city=null,objs=[],holes=[],me=null,ground=null,state='menu',timeLeft=TIME,solo=false,eatenPts=0,ended=false,endT=0;

function buildCity(lv){
  const R=mulberry(lv*7919+3);
  const N=Math.min(7,3+Math.floor((lv+1)/2));
  const W=N*BL,h0=-W/2;
  const list=[],blocks=[];
  const add=(type,x,z,ry=0,mv=null)=>{const t=TYPES[type];list.push({type,v:Math.floor(R()*t.vars),x,z,ry,mv});};
  const pick=w=>{let s=0;for(const k in w)s+=w[k];let r=R()*s;for(const k in w){r-=w[k];if(r<=0)return k;}return Object.keys(w)[0];};
  const pDown=Math.min(.4,.12+lv*.035);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const cx=h0+(i+.5)*BL,cz=h0+(j+.5)*BL;
    const kind=pick({down:pDown,house:.34,park:.26,shop:.4-pDown*.6});
    blocks.push({cx,cz,kind});
    // sidewalk ring
    for(const side of[0,1,2,3])for(let t=-BH+.8;t<=BH-.8;t+=1.5+R()*.6){
      const o=BH-.3,x=side<2?t:(side===2?-o:o),z=side<2?(side===0?-o:o):t;
      const it=pick({person:.36,lamp:.1,hydrant:.07,bin:.07,bush:.08,none:.32});
      if(it==='person')add('person',cx+x,cz+z,R()*6,{walk:side<2?'x':'z',lo:(side<2?cx:cz)-BH+.4,hi:(side<2?cx:cz)+BH-.4,sp:(R()<.5?-1:1)*(.35+R()*.25)});
      else if(it!=='none')add(it,cx+x,cz+z,side<2?0:Math.PI/2);
    }
    const q=1.85;
    if(kind==='house'){
      for(const a of[-1,1])for(const b of[-1,1])R()<.85?add('house',cx+a*q,cz+b*q,[0,Math.PI/2,Math.PI,-Math.PI/2][Math.floor(R()*4)]):add('tree',cx+a*q,cz+b*q);
      add(R()<.5?'tree':'bush',cx,cz);for(const [a,b] of[[0,-q],[0,q],[-q,0],[q,0]])if(R()<.6)add(R()<.5?'bush':'tree',cx+a,cz+b);
    }else if(kind==='down'){
      if(R()<.4){add('tower',cx,cz);for(const a of[-1,1])for(const b of[-1,1])add(['bin','bench','person','lamp'][Math.floor(R()*4)],cx+a*2.9,cz+b*2.9);}
      else for(const a of[-1,1])for(const b of[-1,1])R()<.85?add('building',cx+a*q,cz+b*q):add('kiosk',cx+a*q,cz+b*q);
    }else if(kind==='shop'){
      for(const a of[-1,1])for(const b of[-1,1])add(R()<.75?'kiosk':'bush',cx+a*q,cz+b*q,b>0?0:Math.PI);
      add('car',cx,cz,R()<.5?0:Math.PI/2);add('person',cx+.9,cz+.2,R()*6);add('person',cx-.9,cz-.2,R()*6);
    }else{
      const pts=[];
      for(let k=0;k<40&&pts.length<14;k++){
        const x=(R()*2-1)*(BH-1.1),z=(R()*2-1)*(BH-1.1);
        if(pts.some(p=>Math.hypot(p[0]-x,p[1]-z)<1.25))continue;pts.push([x,z]);
        const it=pick({tree:.38,bush:.2,bench:.14,person:.2,lamp:.08});
        add(it,cx+x,cz+z,it==='bench'||it==='person'?R()*6:0);
      }
    }
  }
  // roads: parked cars along the kerbs, buses now and then, a few cones; moving cars keep to the middle lanes
  for(let k=0;k<=N;k++){
    const rp=h0+k*BL;
    for(const axis of['x','z']){
      for(let s=0;s<N;s++){
        const a0=h0+s*BL+ROAD/2+.9,a1=h0+(s+1)*BL-ROAD/2-.9;
        for(let t=a0;t<a1;t+=2.2+R()*1.6){
          const side=R()<.5?-1:1,r=R();
          const lat=rp+side*1.3;
          const x=axis==='x'?t:lat,z=axis==='x'?lat:t,ry=axis==='x'?0:Math.PI/2;
          if(r<.32)add('car',x,z,ry);
          else if(r<.38&&t+2<a1){add('bus',axis==='x'?t+.8:lat,axis==='x'?lat:t+.8,ry);t+=1.6;}
          else if(r<.44)add('cone',x,z);
        }
      }
      const nMove=1+Math.floor(R()*2);
      for(let m=0;m<nMove;m++){
        const dir=R()<.5?-1:1,lat=rp+dir*.45,t=h0+R()*W;
        add('car',axis==='x'?t:lat,axis==='x'?lat:t,axis==='x'?(dir>0?0:Math.PI):(dir>0?-Math.PI/2:Math.PI/2),{drive:axis,sp:dir*(1.2+R()*.6),lo:h0-ROAD/2,hi:h0+W+ROAD/2});
      }
    }
  }
  // spawn points are road crossings; the player starts at the one nearest the middle
  const cross=[];for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)cross.push([h0+i*BL,h0+j*BL]);
  const mid=Math.floor(N/2),start=[h0+mid*BL,h0+mid*BL];
  const others=cross.filter(c=>Math.hypot(c[0]-start[0],c[1]-start[1])>=BL*.99);
  for(let i=others.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  others.sort((a,b)=>(Math.hypot(a[0]-start[0],a[1]-start[1])<BL*2.5?0:1)-(Math.hypot(b[0]-start[0],b[1]-start[1])<BL*2.5?0:1));
  const spawns=[start,...others];
  const items=list.filter(o=>!spawns.slice(0,6).some(s=>Math.hypot(o.x-s[0],o.z-s[1])<1.4));
  return {N,W,h0,blocks,items,spawns,total:items.reduce((s,o)=>s+TYPES[o.type].pts,0)};
}

function groundTexture(c){
  const G=c.W+ROAD+24,PPU=Math.min(16,2048/G),px=Math.ceil(G*PPU);
  const cvs=document.createElement('canvas');cvs.width=cvs.height=px;const g=cvs.getContext('2d');
  const X=x=>(x+G/2)*PPU;
  g.fillStyle='#93d66b';g.fillRect(0,0,px,px);
  g.fillStyle='#86cc5f';for(let i=0;i<px*px/900;i++){g.beginPath();g.arc(Math.random()*px,Math.random()*px,PPU*.18,0,7);g.fill();}
  const a=c.h0-ROAD/2,b=c.h0+c.W+ROAD/2;
  g.fillStyle='#69707c';g.fillRect(X(a),X(a),(b-a)*PPU,(b-a)*PPU);
  const LAWN={park:'#8bd463',house:'#a6df7c',down:'#d8d2c6',shop:'#f2dcb8'};
  for(const k of c.blocks){
    g.fillStyle='#ece6da';g.fillRect(X(k.cx-BH),X(k.cz-BH),BH*2*PPU,BH*2*PPU);
    g.fillStyle=LAWN[k.kind];g.fillRect(X(k.cx-BH+.6),X(k.cz-BH+.6),(BH-.6)*2*PPU,(BH-.6)*2*PPU);
    if(k.kind==='park'){g.fillStyle='#e9d9a8';g.fillRect(X(k.cx-BH+.6),X(k.cz-.35),(BH-.6)*2*PPU,.7*PPU);g.fillRect(X(k.cx-.35),X(k.cz-BH+.6),.7*PPU,(BH-.6)*2*PPU);}
  }
  // dashed centre lines and zebra crossings
  g.fillStyle='#f5f5f0';
  for(let k=0;k<=c.N;k++){const rp=c.h0+k*BL;
    for(let s=0;s<c.N;s++){const a0=c.h0+s*BL+ROAD/2,a1=c.h0+(s+1)*BL-ROAD/2;
      for(let t=a0+1.2;t<a1-1.2;t+=1.6){g.fillRect(X(t),X(rp-.06),.8*PPU,.12*PPU);g.fillRect(X(rp-.06),X(t),.12*PPU,.8*PPU);}
      for(let q=-ROAD/2+.2;q<ROAD/2-.2;q+=.5){
        g.fillRect(X(a0+.15),X(rp+q),.6*PPU,.28*PPU);g.fillRect(X(a1-.75),X(rp+q),.6*PPU,.28*PPU);
        g.fillRect(X(rp+q),X(a0+.15),.28*PPU,.6*PPU);g.fillRect(X(rp+q),X(a1-.75),.28*PPU,.6*PPU);
      }
    }
  }
  const tex=new THREE.CanvasTexture(cvs);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return {tex,G};
}

// Holes: an invisible disc writes 1 into the stencil, and the ground skips those pixels, so you see down into a dark well where things fall.
const maskMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false,stencilWrite:true,stencilRef:1,stencilFunc:THREE.AlwaysStencilFunc,stencilZPass:THREE.ReplaceStencilOp});

const maskGeo=new THREE.CircleGeometry(1,48).rotateX(-Math.PI/2);

  for(let i=0;i<p.count;i++){c.copy(top).lerp(bot,clamp(-p.getY(i)*2.2,0,1));a.set([c.r,c.g,c.b],i*3);}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;})();
const wellMat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide});
const floorMat=new THREE.MeshBasicMaterial({color:'#050308'});
const RAINBOW=['#ff5a5a','#ff9a3d','#ffd23d','#5fd36b','#4db6ff','#a77bff'];
function rimGeo(kind,col){
  const T=(r,t,arc=Math.PI*2)=>new THREE.TorusGeometry(r,t,8,48,arc);
  const flat={rx:-Math.PI/2};
  if(kind==='basic')return M([P(T(1.02,.07),col,0,.03,0,flat)]);
  if(kind==='monster'){
    const a=[P(T(1.08,.17),'#6ccf3a',0,.05,0,flat),P(T(1.22,.07),'#3f9a22',0,.03,0,flat),P(T(.9,.05),'#c2324a',0,.02,0,flat)];
    for(let i=0;i<16;i++){const t=i/16*Math.PI*2;a.push(P(Kc(.08,.24,6),'#ffffff',Math.cos(t)*.93,.14,Math.sin(t)*.93));}
    for(const s of[-1,1]){a.push(P(S(.27),'#ffffff',s*.48,.32,-1.08),P(S(.13),'#22202e',s*.46,.36,-.86),P(S(.04),'#ffffff',s*.42,.42,-.75),P(S(.29),'#6ccf3a',s*.48,.2,-1.12,{sy:.6}));}
    return M(a);
  }
  if(kind==='cat'){
    const a=[P(T(1.07,.13),'#ffa94d',0,.05,0,flat)];
    for(const s of[-1,1])a.push(P(Kc(.32,.55,4),'#ffa94d',s*.62,.3,-.92,{ry:Math.PI/4}),P(Kc(.18,.32,4),'#ffc3d0',s*.62,.26,-.82,{ry:Math.PI/4}));
    for(const s of[-1,1])for(const k of[-1,1])a.push(P(B(.45,.03,.03),'#5a3a22',s*1.32,.06,.3+k*.12,{ry:s*k*.2}));
    return M(a);
  }
  if(kind==='flower'){
    const a=[P(T(1.04,.08),'#7ed957',0,.03,0,flat)];
    for(let i=0;i<12;i++){const t=i/12*Math.PI*2;a.push(P(S(.2),i%2?'#ff8ad8':'#ffd23d',Math.cos(t)*1.12,.06,Math.sin(t)*1.12,{sy:.35}));}
    return M(a);

  if(kind==='rainbow')return M(RAINBOW.map((c,i)=>P(T(1.06,.12,Math.PI/3+.02),c,0,.05,0,{rx:-Math.PI/2,rz:i*Math.PI/3})));

    const a=[P(T(1.05,.1),'#ffd23d',0,.04,0,flat)];
    for(let i=0;i<8;i++){const t=i/8*Math.PI*2;a.push(P(Kc(.16,.36,4),'#ffe680',Math.cos(t)*1.22,.06,Math.sin(t)*1.22,{rx:Math.PI/2,ry:-t+Math.PI/2,sz:.5}));}
    return M(a);
  }

}
function makeHole(name,col,kind,x,z,isMe){
  const g=new THREE.Group();

  const well=new THREE.Mesh(wellGeo,wellMat);
  const floor=new THREE.Mesh(maskGeo,floorMat);
  const rim=new THREE.Mesh(rimGeo(kind,col),MAT);
  g.add(mask,well,floor,rim);scene.add(g);
  const h={name,col,kind,x,z,vx:0,vz:0,lvl:0,prog:0,score:0,r:R0,hr:R0,pulse:0,me:isMe,g,mask,well,floor,rim,ai:{tx:x,tz:z,think:0,target:null}};
  placeHole(h);return h;
}
function placeHole(h){
  const r=h.r*(1+h.pulse*.12),d=2+r*3;
  h.g.position.set(h.x,0,h.z);
  h.mask.scale.set(r,1,r);h.well.scale.set(r,d,r);h.floor.scale.set(r,1,r);h.floor.position.y=-d;h.rim.scale.setScalar(r);
}
function setRim(h,kind){h.kind=kind;h.rim.geometry.dispose();h.rim.geometry=rimGeo(kind,h.col);}

function clearWorld(){
  for(const o of objs)scene.remove(o.mesh);objs=[];
  for(const h of holes){scene.remove(h.g);h.rim.geometry.dispose();}holes=[];
  if(ground){scene.remove(ground);groundMat.map&&groundMat.map.dispose();ground=null;}
  texts=[];parts=[];
}
function resetRun(){
  clearWorld();
  city=buildCity(level);solo=isSolo(level);
  const {tex,G}=groundTexture(city);groundMat.map=tex;groundMat.needsUpdate=true;
  ground=new THREE.Mesh(new THREE.PlaneGeometry(G,G).rotateX(-Math.PI/2),groundMat);ground.renderOrder=-1;scene.add(ground);
  for(const it of city.items){
    const t=TYPES[it.type],mesh=new THREE.Mesh(geoOf(it.type,it.v),MAT);
    mesh.position.set(it.x,0,it.z);mesh.rotation.y=it.ry;mesh.matrixAutoUpdate=!!it.mv;mesh.updateMatrix();scene.add(mesh);
    objs.push({type:it.type,x:it.x,z:it.z,ry:it.ry,mv:it.mv,size:t.size,pts:t.pts,mesh,fall:null,wob:0});
  }
  me=makeHole('나',ME_COL,skin,city.spawns[0][0],city.spawns[0][1],true);holes=[me];
  if(!solo){
    const names=NAMES.slice().sort(()=>Math.random()-.5),cols=HCOL.slice().sort(()=>Math.random()-.5);
    for(let i=0;i<rivalsOf(level);i++){const s=city.spawns[1+i];holes.push(makeHole(names[i],cols[i],'basic',s[0],s[1],false));}
  }
  timeLeft=TIME;eatenPts=0;ended=false;endT=0;moved=false;joy=null;
  camSnap=true;showHud();
}

// ---------- update ----------
const lim=()=>city.W/2+ROAD/2-.3;
function addPts(h,p){
  h.score+=p;if(h.lvl>=MAXLV)return;h.prog+=p;
  while(h.lvl<MAXLV&&h.prog>=need(h.lvl)){h.prog-=need(h.lvl);h.lvl++;h.hr=radOf(h.lvl);h.pulse=1;
    if(h.me){texts.push({t:'커졌어요!',h,y:1.5,life:1.2,col:'#6ccf3a',big:true});burst(h.x,h.z,h.hr);}}
  if(h.lvl>=MAXLV)h.prog=0;
}
function burst(x,z,r){for(let i=0;i<18;i++){const t=Math.random()*7;parts.push({x:x+Math.cos(t)*r,y:.2,z:z+Math.sin(t)*r,vx:Math.cos(t)*rand(2,4),vy:rand(3,6),vz:Math.sin(t)*rand(2,4),life:.9,col:RAINBOW[i%6]});}}

function think(h){
  // rivals chase the juiciest thing nearby that fits; they ease off when far ahead so a 4-year-old can keep up
  const ai=h.ai;let best=null,bs=0;
  for(const o of objs){if(o.fall||o.size>=h.hr*FIT)continue;const d=Math.hypot(o.x-h.x,o.z-h.z);if(d>16)continue;const s=o.pts/(d+2)*rand(.5,1.5);if(s>bs){bs=s;best=o;}}
  if(best){ai.target=best;ai.tx=best.x;ai.tz=best.z;}else{ai.target=null;ai.tx=clamp(h.x+rand(-10,10),-lim(),lim());ai.tz=clamp(h.z+rand(-10,10),-lim(),lim());}
  ai.think=rand(.9,1.8);
}
function moveHoles(dt){
  const skill=Math.min(.86,.55+level*.025);
  for(const h of holes){
    let dx=0,dz=0;
    if(h.me&&!window.holeAuto){
      if(joy&&joy.m>0){dx=joy.dx;dz=joy.dy;}
      if(keys.size){let kx=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),kz=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);const l=Math.hypot(kx,kz);if(l){dx=kx/l;dz=kz/l;}}
    }else{
      const ai=h.ai;ai.think-=dt;
      if(ai.think<=0||(ai.target&&ai.target.fall))think(h);
      if(ai.target){ai.tx=ai.target.x;ai.tz=ai.target.z;}
      const ex=ai.tx-h.x,ez=ai.tz-h.z,l=Math.hypot(ex,ez);
      if(l>.2){const k=h.me?1:skill*(h.score>me.score*1.15+8?.55:1);dx=ex/l*k;dz=ez/l*k;}
    }
    const sp=speedOf(h.r);
    h.vx+=(dx*sp-h.vx)*Math.min(1,dt*8);h.vz+=(dz*sp-h.vz)*Math.min(1,dt*8);
    h.x=clamp(h.x+h.vx*dt,-lim(),lim());h.z=clamp(h.z+h.vz*dt,-lim(),lim());
    h.r+=(h.hr-h.r)*Math.min(1,dt*4);h.pulse=Math.max(0,h.pulse-dt*2.5);
  }
  // holes slide off each other instead of eating one another
  for(let i=0;i<holes.length;i++)for(let j=i+1;j<holes.length;j++){
    const a=holes[i],b=holes[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||.01,m=(a.r+b.r)*.85;
    if(d<m){const p=(m-d)/2,ux=dx/d,uz=dz/d;a.x-=ux*p;a.z-=uz*p;b.x+=ux*p;b.z+=uz*p;}
  }
  holes.forEach(placeHole);
}
function updateObjs(dt,now){
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];
    if(o.fall){
      const f=o.fall,h=f.h,k=Math.pow(.04,dt);
      f.ox*=k;f.oz*=k;f.vy+=16*dt;f.y-=f.vy*dt;
      o.mesh.position.set(h.x+f.ox,f.y,h.z+f.oz);o.mesh.rotation.x+=f.rx*dt;o.mesh.rotation.z+=f.rz*dt;
      if(f.y<-(2+h.r*3)-2.5){scene.remove(o.mesh);objs.splice(i,1);}
      continue;
    }
    if(o.mv&&state==='play'){
      const m=o.mv;
      if(m.drive){if(m.drive==='x'){o.x+=m.sp*dt;if(o.x>m.hi)o.x=m.lo;if(o.x<m.lo)o.x=m.hi;}else{o.z+=m.sp*dt;if(o.z>m.hi)o.z=m.lo;if(o.z<m.lo)o.z=m.hi;}}
      else{const v=m.walk==='x'?'x':'z';o[v]+=m.sp*dt;if(o[v]>m.hi||o[v]<m.lo){m.sp=-m.sp;o[v]=clamp(o[v],m.lo,m.hi);}o.mesh.rotation.y=m.walk==='x'?(m.sp>0?Math.PI/2:-Math.PI/2):(m.sp>0?0:Math.PI);}
      o.mesh.position.set(o.x,0,o.z);
    }
    if(state!=='play')continue;
    for(const h of holes){
      const dx=o.x-h.x,dz=o.z-h.z,d2=dx*dx+dz*dz;
      if(o.size<h.hr*FIT){
        const lim=Math.max(.05,h.r-o.size*.3);
        if(d2<lim*lim){
          o.fall={h,ox:dx,oz:dz,y:0,vy:0,rx:rand(-2.5,2.5),rz:rand(-2.5,2.5)};o.mesh.matrixAutoUpdate=true;
          addPts(h,o.pts);if(solo&&h.me)eatenPts+=o.pts;
          if(h.me)texts.push({t:'+'+o.pts,x:o.x,y:1+o.size,z:o.z,life:.8,col:'#ffffff'});
          break;
        }
      }else if(d2<(h.r*.8)**2){o.wob=.4;}
    }
    if(o.wob>0){o.wob-=dt;o.mesh.matrixAutoUpdate=true;o.mesh.rotation.z=Math.sin(now/30)*.05*Math.min(1,o.wob*3);if(o.wob<=0){o.mesh.rotation.z=0;o.mesh.updateMatrix();o.mesh.matrixAutoUpdate=!!o.mv;}}
  }
}
function update(dt,now){
  if(!city)return;
  if(state==='play'){
    timeLeft-=dt;
    if(solo&&eatenPts/city.total*100>=soloGoal(level)&&!ended){ended=true;endT=1.2;texts.push({t:'성공!',h:me,y:2,life:1.4,col:'#ffd23d',big:true});burst(me.x,me.z,me.r);}
    if(timeLeft<=0&&!ended){timeLeft=0;ended=true;endT=1.0;texts.push({t:'끝!',h:me,y:2,life:1.2,col:'#ff5a5a',big:true});}
    if(ended){endT-=dt;if(endT<=0){state='result';showResult();}}
    else moveHoles(dt);
    boardT-=dt;if(boardT<=0){boardT=.25;showHud();}
  }else if(state==='menu'){holes.forEach(placeHole);}
  updateObjs(dt,now);
  for(const p of parts){p.vy-=14*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0&&p.y>-1);
  texts=texts.filter(t=>(t.life-=dt)>0);
}

// ---------- camera + overlay ----------
let camSnap=true;const camAt=new THREE.Vector3(),camPos=new THREE.Vector3();
function sync3D(dt,now){
  if(!me)return;
  const H=10+me.r*4.6+(state==='menu'?1.5+Math.sin(now/2400)*.6:0);
  const tx=me.x,tz=me.z;
  const k=camSnap?1:Math.min(1,dt*5);camSnap=false;
  camAt.lerp(new THREE.Vector3(tx,0,tz-H*.08),k);camPos.lerp(new THREE.Vector3(tx,H,tz+H*.62),k);
  cam.position.copy(camPos);cam.lookAt(camAt);
  scene.fog.near=H*1.5;scene.fog.far=H*3.6;
  renderer.render(scene,cam);
}
const _v=new THREE.Vector3();
function proj(x,y,z){_v.set(x,y,z).project(cam);return [(_v.x+1)/2*VW,(1-_v.y)/2*VH,_v.z<1];}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawOverlay(now){
  ctx.clearRect(0,0,VW,VH);
  if(!me)return;
  // ring around my hole: fills up, then the hole grows
  if(state==='play'&&me.lvl<MAXLV){
    const r=me.r*1.32,f=me.prog/need(me.lvl);
    const ring=(a0,a1,col,w)=>{ctx.beginPath();for(let i=0;i<=40;i++){const t=a0+(a1-a0)*i/40,[sx,sy]=proj(me.x+Math.sin(t)*r,.05,me.z-Math.cos(t)*r);i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);}ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();};
    ring(0,Math.PI*2,'rgba(255,255,255,.45)',7);if(f>0)ring(0,Math.PI*2*f,'#ffe14d',7);
  }
  // name tags
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const h of holes){
    if(h.me&&state==='menu')continue;
    const [sx,sy,ok]=proj(h.x,0,h.z-h.r*1.15);if(!ok||sx<-60||sx>VW+60||sy<-40||sy>VH+40)continue;
    ctx.font='18px "Do Hyeon",sans-serif';const w=ctx.measureText(h.name).width+20;
    ctx.fillStyle=h.col;rrect(ctx,sx-w/2,sy-34,w,26,13);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(h.name,sx,sy-20);
  }
  for(const p of parts){const [sx,sy,ok]=proj(p.x,p.y,p.z);if(!ok)continue;ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(sx,sy,5,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const t of texts){
    const [sx,sy,ok]=t.h?proj(t.h.x,t.y+t.h.r+(1-t.life)*1.2,t.h.z-t.h.r):proj(t.x,t.y+(1-t.life)*1.2,t.z);if(!ok)continue;
    ctx.globalAlpha=Math.min(1,t.life*2.5);ctx.font=(t.big?'44px':'26px')+' "Black Han Sans","Do Hyeon",sans-serif';
    ctx.lineWidth=t.big?8:6;ctx.lineJoin='round';ctx.strokeStyle='rgba(42,33,71,.75)';ctx.strokeText(t.t,sx,sy);ctx.fillStyle=t.col;ctx.fillText(t.t,sx,sy);
  }
  ctx.globalAlpha=1;
  if(state==='play'&&joy){
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(joy.ox,joy.oy,58,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(joy.ox+joy.dx*joy.m*46,joy.oy+joy.dy*joy.m*46,24,0,7);ctx.fill();
  }
  if(state==='play'&&!moved){
    const p=(Math.sin(now/220)+1)/2,cx=VW/2,cy=VH*.74;
    ctx.globalAlpha=.9;ctx.fillStyle='#fff';rrect(ctx,cx-110,cy-30,220,56,28);ctx.fill();ctx.globalAlpha=1;
    ctx.font='24px "Do Hyeon",sans-serif';ctx.fillStyle='#4a3b8f';ctx.fillText('손가락으로 끌어요',cx,cy-1);
    ctx.font='40px sans-serif';ctx.fillText('👆',cx-40+p*80,cy+52);
  }
}

// ---------- flat hole drawings (shop, help, menu button) ----------
function drawHole(g,cx,cy,r,kind,col){
  g.save();g.translate(cx,cy);
  const ell=(rr,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(0,0,rr,rr*.62,0,0,7);g.fill();};
  const ring=(rr,w,c)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.ellipse(0,0,rr,rr*.62,0,0,7);g.stroke();};
  if(kind==='monster'){ell(r*1.22,'#3f9a22');ell(r*1.12,'#6ccf3a');}
  ell(r,'#c2324a');ell(r*.88,'#1a1426');
  const gr=g.createRadialGradient(0,r*.15,0,0,0,r);gr.addColorStop(0,'#000');gr.addColorStop(1,'#3a2f52');g.fillStyle=gr;g.beginPath();g.ellipse(0,0,r*.86,r*.53,0,0,7);g.fill();
  if(kind==='basic')ring(r,r*.12,col||ME_COL);
  else if(kind==='monster'){
    g.fillStyle='#fff';for(let i=0;i<14;i++){const t=i/14*Math.PI*2,x=Math.cos(t)*r*.88,y=Math.sin(t)*r*.55;g.beginPath();g.moveTo(x-r*.08,y);g.lineTo(x+r*.08,y);g.lineTo(x*.86,y*.8-r*.12);g.fill();}
    for(const s of[-1,1]){g.fillStyle='#6ccf3a';g.beginPath();g.arc(s*r*.5,-r*.62,r*.32,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s*r*.5,-r*.66,r*.25,0,7);g.fill();g.fillStyle='#22202e';g.beginPath();g.arc(s*r*.46,-r*.6,r*.12,0,7);g.fill();}
  }else if(kind==='cat'){
    ring(r*1.05,r*.2,'#ffa94d');
    for(const s of[-1,1]){g.fillStyle='#ffa94d';g.beginPath();g.moveTo(s*r*.3,-r*.55);g.lineTo(s*r*.62,-r*1.2);g.lineTo(s*r*.9,-r*.4);g.fill();g.fillStyle='#ffc3d0';g.beginPath();g.moveTo(s*r*.45,-r*.6);g.lineTo(s*r*.62,-r*1.0);g.lineTo(s*r*.78,-r*.52);g.fill();}
    g.strokeStyle='#5a3a22';g.lineWidth=2;for(const s of[-1,1])for(const k of[-1,1]){g.beginPath();g.moveTo(s*r*1.1,k*r*.1);g.lineTo(s*r*1.5,k*r*.22);g.stroke();}
  }else if(kind==='flower'){ring(r*1.02,r*.1,'#7ed957');for(let i=0;i<12;i++){const t=i/12*Math.PI*2;g.fillStyle=i%2?'#ff8ad8':'#ffd23d';g.beginPath();g.ellipse(Math.cos(t)*r*1.12,Math.sin(t)*r*.7,r*.2,r*.13,0,0,7);g.fill();}}
  else if(kind==='rainbow'){for(let i=0;i<6;i++){g.strokeStyle=RAINBOW[i];g.lineWidth=r*.2;g.beginPath();g.ellipse(0,0,r*1.04,r*.645,0,i/6*Math.PI*2,(i+1)/6*Math.PI*2+.02);g.stroke();}}
  else if(kind==='star'){ring(r*1.03,r*.15,'#ffd23d');g.font=`${Math.round(r*.45)}px sans-serif`;g.textAlign='center';g.textBaseline='middle';for(let i=0;i<8;i++){const t=i/8*Math.PI*2;g.fillText('⭐',Math.cos(t)*r*1.25,Math.sin(t)*r*.8);}}
  g.restore();
}
function drawSkinIcons(){
  const g=$('skinIc').getContext('2d');g.clearRect(0,0,80,80);drawHole(g,40,46,24,skin);
  const h=$('helpHole').getContext('2d');h.clearRect(0,0,120,120);drawHole(h,60,72,40,'basic','#7b5cff');
  h.font='34px sans-serif';h.textAlign='center';h.fillText('🚗',60,48);
}

// ---------- screens ----------
function setCoins(){$('coinTxt').textContent=coins;}
const fmt=t=>{t=Math.ceil(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
function ranking(){return holes.slice().sort((a,b)=>b.score-a.score);}
function showHud(){
  const play=state==='play';
  $('timer').hidden=!play;$('board').hidden=!play||solo;$('goal').hidden=!play||!solo;
  if(!play)return;
  $('timer').textContent=fmt(timeLeft);$('timer').classList.toggle('hurry',timeLeft<=10);
  if(solo){const p=Math.min(100,eatenPts/city.total*100);$('goalFill').style.width=p+'%';$('goalMark').style.left=soloGoal(level)+'%';$('goalTxt').textContent=Math.floor(p)+'%';}
  else $('board').innerHTML=ranking().map((h,i)=>`<div class="row${h.me?' me':''}"><b>${i+1}</b><i style="--c:${h.col}"></i><span>${h.name}</span><em>${h.score}</em></div>`).join('');
}
function showLvl(){
  $('menuLvl').textContent='레벨 '+level;$('lvPrev').disabled=level<=1;$('lvNext').disabled=level>=best;
  $('menuMode').textContent=isSolo(level)?`혼자서 도시를 ${soloGoal(level)}% 먹어요!`:`친구 ${rivalsOf(level)}명보다 크게 커져요!`;
}
function showMenu(){
  state='menu';$('resBox').hidden=true;$('menu').hidden=false;
  resetRun();showLvl();setCoins();drawSkinIcons();
}
function startRun(){
  $('menu').hidden=true;$('resBox').hidden=true;
  if(state!=='menu')resetRun();
  state='play';showHud();
}
function showResult(){
  showHud();
  let earned,title,msg;
  if(solo){
    const p=Math.floor(Math.min(100,eatenPts/city.total*100)),ok=p>=soloGoal(level);
    earned=Math.round(20+p*.6)+(ok?30:0)+level*2;title=ok?'성공!':'잘했어요!';msg=`도시를 ${p}% 먹었어요`;
    $('resRanks').innerHTML='';
  }else{
    const rk=ranking(),pos=rk.indexOf(me);
    earned=[60,40,28,20,14,10][pos]+level*2;title=pos===0?'👑 1등!':`${pos+1}등! 잘했어요`;msg=pos===0?'가장 큰 구멍이에요!':'다음엔 더 크게 커져요!';
    $('resRanks').innerHTML=rk.map((h,i)=>`<div class="row${h.me?' me':''}"><b>${i+1}</b><i style="--c:${h.col}"></i><span>${h.name}</span><em>${h.score}</em></div>`).join('');
  }
  coins+=earned;if(level>=best)best=level+1;
  save();setCoins();
  $('resTitle').textContent=title;$('resMsg').textContent=msg;$('resCoins').textContent=earned;
  $('resTitle').classList.remove('pop');void $('resTitle').offsetWidth;$('resTitle').classList.add('pop');
  $('resBox').hidden=false;
}
function showSkins(){
  $('skinList').innerHTML='';
  for(const s of SKINS){
    const b=document.createElement('button');b.className='skin'+(s.id===skin?' on':'')+(!owned.includes(s.id)&&coins<s.cost?' poor':'');
    const c=document.createElement('canvas');c.width=c.height=144;drawHole(c.getContext('2d'),72,80,44,s.id);
    b.append(c);const n=document.createElement('span');n.textContent=s.name;b.append(n);
    if(!owned.includes(s.id)){const p=document.createElement('span');p.className='c';p.innerHTML=`<i class="coin"></i>${s.cost}`;b.append(p);}
    b.onclick=()=>{
      if(!owned.includes(s.id)){if(coins<s.cost){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}coins-=s.cost;owned.push(s.id);}
      skin=s.id;save();setCoins();if(me)setRim(me,skin);drawSkinIcons();showSkins();
    };
    $('skinList').append(b);
  }
  $('skinBox').hidden=false;
}

function pickLvl(d){const n=clamp(level+d,1,best);if(n===level)return;level=n;save();showLvl();resetRun();}
$('lvPrev').onclick=()=>pickLvl(-1);
$('lvNext').onclick=()=>pickLvl(1);
$('startBtn').onclick=startRun;
$('skinBtn').onclick=showSkins;
$('skinOk').onclick=()=>{$('skinBox').hidden=true;};
$('helpBtn').onclick=()=>{$('helpBox').hidden=false;drawSkinIcons();};
$('helpOk').onclick=()=>{$('helpBox').hidden=true;};
$('homeBtn').onclick=showMenu;
$('againBtn').onclick=()=>{level=Math.min(best,level+1);save();state='end';startRun();};

// floating joystick: put a finger down anywhere and drag
wrap.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();const r=wrap.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,dx:0,dy:0,m:0};try{wrap.setPointerCapture(e.pointerId);}catch(_){}});
wrap.addEventListener('pointermove',e=>{
  if(!joy||e.pointerId!==joy.id)return;const r=wrap.getBoundingClientRect();
  let x=e.clientX-r.left-joy.ox,y=e.clientY-r.top-joy.oy;const l=Math.hypot(x,y);
  if(l>60){joy.ox+=x/l*(l-60);joy.oy+=y/l*(l-60);x=x/l*60;y=y/l*60;}
  const m=Math.hypot(x,y);if(m<6){joy.m=0;return;}joy.dx=x/m;joy.dy=y/m;joy.m=Math.min(1,m/40);moved=true;
});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null;};
wrap.addEventListener('pointerup',endJoy);wrap.addEventListener('pointercancel',endJoy);
const keys=new Set();
addEventListener('keydown',e=>{if(/^Arrow|^Key[WASD]$/.test(e.code)){keys.add(e.code);if(state==='play'){moved=true;e.preventDefault();}}});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
addEventListener('resize',resize);

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt,now);sync3D(dt,now);drawOverlay(now);
  requestAnimationFrame(loop);
}
// read-only peek for automated checks
window.holeDebug=()=>({state,level,best,coins,solo,timeLeft,eatenPts,total:city&&city.total,objs:objs.length,holes:holes.map(h=>({name:h.name,x:h.x,z:h.z,r:h.r,lvl:h.lvl,score:h.score}))});
window.holeTime=t=>{timeLeft=t;};
window.holeSim=sec=>{for(let i=0;i<sec*30;i++)update(1/30,i*33);return holeDebug();};
resize();showMenu();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawSkinIcons);
requestAnimationFrame(loop);
</script>
