<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe9c9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="고양이찾기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>숨은 고양이 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap">
<style>
/* Layout: one SVG scene fills the screen (pinch/drag to zoom and move); HUD, buttons and cards float over it. */
:root{
  --bg:#ffe9c9;
  --ink:#4a3020;
  --muted:#8a6a55;
  --green:#3fbf55;
  --orange:#ff8a3d;
  --red:#ff5a5a;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{position:relative;height:100%;max-width:640px;margin:0 auto;overflow:hidden;background:#f3e3cc}
svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
button{font-family:var(--display);font-size:24px;color:#fff;background:var(--orange);border:0;border-radius:20px;padding:12px 34px;box-shadow:0 5px 0 #c25a17;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c25a17}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.round{width:46px;height:46px;padding:0;border-radius:50%;background:#fff;color:#8a5a30;font-size:22px;box-shadow:0 4px 0 rgba(120,70,20,.2);flex:none}
button.round:active{transform:scale(.92)}
button:disabled{opacity:.4}
.hud{position:absolute;z-index:7;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:linear-gradient(rgba(255,240,215,.97),rgba(255,240,215,.9));box-shadow:0 3px 10px rgba(100,60,20,.15);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hrow{display:flex;align-items:center;gap:8px}
.title{flex:1;text-align:center;font-family:"Black Han Sans",var(--display);font-size:22px;color:#8a5a30;line-height:1.05}
.title small{display:block;font-family:var(--body);font-size:14px;color:var(--muted)}
.pill{background:#fff;border-radius:16px;padding:6px 10px;font-family:var(--display);font-size:19px;color:#8a5a30;box-shadow:0 3px 0 rgba(120,70,20,.15);white-space:nowrap}
.tray{flex:1;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.tray svg{width:28px;height:28px;opacity:.28;filter:grayscale(1)}
.tray svg.on{opacity:1;filter:none;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.hearts{font-family:var(--emoji);font-size:20px;letter-spacing:1px;white-space:nowrap}
.hearts .lost{opacity:.22;filter:grayscale(1)}
.hearts.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.timer{flex:1;height:12px;background:rgba(138,90,48,.18);border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#5fbf4a;border-radius:9px}
.timer i.low{background:#ff5a5a}
.secs{font-family:var(--display);font-size:18px;color:#8a5a30;min-width:34px;text-align:right}
.tools{position:absolute;z-index:7;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.tools .spacer{flex:1}
.zoom{display:flex;gap:10px;align-items:center}
.zoom button{width:52px;height:52px;font-size:30px;line-height:1}
button.hint{position:relative;width:74px;height:74px;padding:0;border-radius:50%;background:#ffd84a;color:#6a4a00;font-size:36px;box-shadow:0 5px 0 #c9a12a;font-family:var(--emoji)}
button.hint b{position:absolute;right:-4px;top:-4px;background:#ff5a5a;color:#fff;font-family:var(--display);font-weight:400;font-size:17px;min-width:28px;height:28px;border-radius:14px;line-height:28px;padding:0 6px;box-shadow:0 2px 0 #b83030}
.layer{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
#menu{background:linear-gradient(#ffeccf,#ffd7a6)}
.corner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:10px;align-items:center}
.corner.l{left:14px}.corner.r{right:14px}
.logo{font-family:"Black Han Sans",var(--display);font-weight:400;font-size:52px;line-height:1.05;margin:0;text-align:center;text-shadow:0 5px 0 rgba(120,70,20,.18)}
.logo span:nth-child(1){color:#ff5a5a}.logo span:nth-child(2){color:#ff9a2e}.logo span:nth-child(3){color:#3fbf55}.logo span:nth-child(4){color:#3d7bff}.logo span:nth-child(5){color:#b46be0}.logo span:nth-child(6){color:#ff5a5a}.logo span:nth-child(7){color:#ff9a2e}
.sub{font-size:19px;color:var(--muted);margin-top:-6px;text-align:center}
#hero{width:200px;height:200px}
.lvlsel{display:flex;align-items:center;gap:10px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:26px;color:var(--ink);background:#fff;border-radius:24px;padding:10px 16px;min-width:160px;box-shadow:0 4px 0 rgba(120,70,20,.15)}
.lvl small{font-size:16px;color:var(--muted);font-family:var(--body)}
button.big{width:min(300px,100%);font-size:34px;padding:16px 10px;background:var(--red);box-shadow:0 6px 0 #b83030}
button.big:active{box-shadow:0 2px 0 #b83030}
.dim{background:rgba(70,40,10,.35)}
.card{background:#fff;color:var(--ink);border-radius:30px;padding:24px 18px;box-shadow:0 14px 40px rgba(80,40,0,.25);width:min(350px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:400;font-size:36px;margin:0}
.card p{margin:0;color:var(--muted);font-size:18px}
.card .row{display:flex;gap:10px;justify-content:center;width:100%}
.card .row button{flex:1;padding:12px 8px;font-size:22px}
.card button.gray{background:#c9b9a5;box-shadow:0 5px 0 #9a8670}
.card button.go{background:var(--green);box-shadow:0 5px 0 #24823a}
.reward{display:flex;gap:14px;font-family:var(--display);font-size:28px;color:#8a5a30}
.reward span{background:#fff4d6;border-radius:16px;padding:6px 14px}
.bigemoji{font-family:var(--emoji);font-size:64px;line-height:1}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.rules{display:flex;flex-direction:column;gap:12px;text-align:left;font-size:18px;width:100%}
.rules div{display:flex;gap:12px;align-items:center}
.rules b{font-size:30px;min-width:44px;text-align:center;font-family:var(--emoji);font-weight:400}
.found{animation:jump .6s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes jump{0%{transform:scale(1)}40%{transform:translateY(-14%) scale(1.25)}100%{transform:scale(1)}}
.ring{fill:none;stroke:#2f8cff;stroke-width:5}
.hintring{fill:rgba(255,216,74,.25);stroke:#ffb800;stroke-width:6;animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.miss{animation:fade .8s forwards}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.toast{position:absolute;z-index:8;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>

  <div class="hud" id="hud" hidden>
    <div class="hrow">
      <button class="round" id="homeBtn" aria-label="처음으로">⌂</button>
      <div class="title"><span id="lvTitle">레벨 1</span><small id="lvTheme"></small></div>
      <div class="pill">🪙 <span id="hudCoins">0</span></div>
    </div>
    <div class="hrow"><div class="tray" id="tray"></div></div>
    <div class="hrow">
      <div class="hearts" id="hearts"></div>
      <div class="timer"><i id="timeFill"></i></div>
      <div class="secs" id="secs"></div>
    </div>
  </div>

  <div class="tools" id="tools" hidden>
    <div class="zoom"><button class="round" id="zIn" aria-label="크게">＋</button><button class="round" id="zOut" aria-label="작게">－</button></div>
    <div class="spacer"></div>
    <button class="hint" id="hintBtn" aria-label="힌트">🔍<b id="hintN">0</b></button>
  </div>

  <div class="layer" id="menu">
    <div class="corner l"><button class="round" id="helpBtn" aria-label="게임 방법">?</button><button class="round" id="soundBtn" aria-label="소리">🔊</button></div>
    <div class="corner r"><div class="pill">🪙 <span id="menuCoins">0</span></div><div class="pill">🔍 <span id="menuHints">0</span></div></div>
    <h1 class="logo"><span>숨</span><span>은</span> <span>고</span><span>양</span><span>이</span><br><span>찾</span><span>기</span></h1>
    <div class="sub">숨어 있는 야옹이를 모두 찾아요!</div>
    <svg id="hero" viewBox="-60 -110 120 120" aria-hidden="true"></svg>
    <div class="lvlsel"><button class="round" id="lvPrev" aria-label="이전 레벨">◀</button><div class="lvl"><span id="menuLvl">레벨 1</span><small id="menuTheme"></small></div><button class="round" id="lvNext" aria-label="다음 레벨">▶</button></div>
    <button class="big" id="startBtn">시작!</button>
  </div>

  <div class="layer dim" id="helpBox" hidden>
    <div class="card pop">
      <h2>이렇게 해요</h2>
      <div class="rules">
        <div><b>🐱</b><span>그림 속에 숨은 고양이를 톡 눌러요</span></div>
        <div><b>🤏</b><span>두 손가락이나 ＋ 버튼으로 크게 보고, 끌어서 움직여요</span></div>
        <div><b>❤️</b><span>아무것도 없는 곳을 누르면 하트가 하나 없어져요</span></div>
        <div><b>⏰</b><span>하트가 다 없어지거나 시간이 끝나면 다시 해요</span></div>
        <div><b>🔍</b><span>힌트는 레벨을 깨면 받거나 코인으로 사요</span></div>
      </div>
      <button class="go" id="helpOk">알겠어요</button>
    </div>
  </div>

  <div class="layer dim" id="shopBox" hidden>
    <div class="card pop">
      <div class="bigemoji">🔍</div>
      <h2>힌트가 없어요</h2>
      <p>힌트 1개를 코인으로 살 수 있어요<br>레벨을 깨도 힌트를 받아요</p>
      <div class="reward"><span>🪙 <span id="shopCoins">0</span></span></div>
      <button class="go" id="buyBtn">🔍 사기 (🪙 30)</button>
      <button class="gray" id="shopClose">닫기</button>
    </div>
  </div>

  <div class="layer dim" id="winBox" hidden>
    <div class="card pop">
      <div class="bigemoji">😻</div>
      <h2 id="winTitle">다 찾았어요!</h2>
      <p id="winSub"></p>
      <div class="reward" id="winReward"></div>
      <div class="row"><button class="gray" id="winMenu">⌂</button><button class="go" id="winNext">다음 ▶</button></div>
    </div>
  </div>

  <div class="layer dim" id="overBox" hidden>
    <div class="card pop">
      <div class="bigemoji" id="overEmoji">😿</div>
      <h2>앗, 아쉬워요!</h2>
      <p id="overSub"></p>
      <div class="row"><button class="gray" id="overMenu">⌂</button><button class="go" id="overRetry">다시 ↻</button></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';

// ---------- storage (findcat-*) ----------
function ld(k,d){try{const v=localStorage.getItem('findcat-'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem('findcat-'+k,JSON.stringify(v));}catch(e){}}
let maxLevel=ld('max',1),curLevel=Math.min(ld('level',1),maxLevel),coins=ld('coins',0),hints=ld('hints',2),soundOn=ld('sound',true);
const HINT_PRICE=30;

// ---------- random ----------
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;
const rf=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rf(a,b+1)), pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---------- drawing helpers (local coords: bottom-center of each thing is 0,0) ----------
const O='#4a3426';
const K=`stroke="${O}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const Kt=`stroke="${O}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;
const rc=(x,y,w,h,f,r=0,k=K)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${k}/>`;
const ci=(x,y,r,f,k=K)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${k}/>`;
const el=(x,y,a,b,f,k=K)=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${f}" ${k}/>`;
const pa=(d,f,k=K)=>`<path d="${d}" fill="${f}" ${k}/>`;
const ln=(d,c=O,w=2)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const PAL=['#e46c6c','#6c9fe4','#f6c445','#8bc97a','#b78be0','#f39a3d','#f6a3a3','#7fd0c8'];

// ---------- cats ----------
const CATC=['#f39a3d','#9aa3ad','#3b3b45','#ffffff','#e8c58f','#a0704a','#f7c98b','#6f6f78'];
function catFace(x,y,r,closed){
  let s='';
  if(closed)s+=ln(`M${x-r*.55} ${y} q${r*.2} ${r*.22} ${r*.4} 0 M${x+r*.15} ${y} q${r*.2} ${r*.22} ${r*.4} 0`,O,1.6);
  else s+=`<circle cx="${x-r*.38}" cy="${y-r*.05}" r="${r*.16}" fill="${O}"/><circle cx="${x+r*.38}" cy="${y-r*.05}" r="${r*.16}" fill="${O}"/><circle cx="${x-r*.33}" cy="${y-r*.11}" r="${r*.06}" fill="#fff"/><circle cx="${x+r*.43}" cy="${y-r*.11}" r="${r*.06}" fill="#fff"/>`;
  s+=`<path d="M${x-r*.11} ${y+r*.2} h${r*.22} l-${r*.11} ${r*.13}z" fill="#f08a9a"/>`;
  s+=ln(`M${x-r*.3} ${y+r*.28} l-${r*.6} -${r*.06} M${x-r*.3} ${y+r*.38} l-${r*.6} ${r*.1} M${x+r*.3} ${y+r*.28} l${r*.6} -${r*.06} M${x+r*.3} ${y+r*.38} l${r*.6} ${r*.1}`,O,1);
  return s;
}
function catHead(x,y,r,c,closed,stripe){
  const sc=stripe?`<path d="M${x-r*.25} ${y-r*.85} l${r*.08} ${r*.35} M${x} ${y-r*.9} v${r*.38} M${x+r*.25} ${y-r*.85} l-${r*.08} ${r*.35}" stroke="${stripe}" stroke-width="${r*.12}" stroke-linecap="round"/>`:'';
  return pa(`M${x-r*.9} ${y-r*.3} L${x-r*.8} ${y-r*1.35} L${x-r*.15} ${y-r*.85}Z M${x+r*.9} ${y-r*.3} L${x+r*.8} ${y-r*1.35} L${x+r*.15} ${y-r*.85}Z`,c)+
    `<path d="M${x-r*.72} ${y-r*.5} L${x-r*.68} ${y-r*1.05} L${x-r*.36} ${y-r*.8}Z M${x+r*.72} ${y-r*.5} L${x+r*.68} ${y-r*1.05} L${x+r*.36} ${y-r*.8}Z" fill="#f5b3bd"/>`+
    el(x,y,r,r*.9,c)+sc+catFace(x,y,r,closed);
}
function stripeOf(c){return c==='#f39a3d'?'#d9772a':c==='#9aa3ad'?'#7d858f':c==='#e8c58f'?'#c9a46c':null;}
// pose: sit | lie | peek | tail. Returns svg in local coords (unit size ~ 60 wide, 72 tall)
function catSVG(pose,c){
  const st=stripeOf(c);let g='';
  const tail=d=>ln(d,O,9)+ln(d,c,5);
  if(pose==='sit'){
    g+=tail('M14 -6 C40 -6 40 -40 26 -44');
    g+=el(0,-20,19,21,c)+`<ellipse cx="0" cy="-16" rx="9" ry="12" fill="#fff4e6" opacity=".7"/>`;
    g+=el(-8,-1,6,3.5,c)+el(8,-1,6,3.5,c);
    g+=catHead(0,-48,16,c,false,st);
  }else if(pose==='lie'){
    g+=tail('M28 -8 C44 -4 40 8 14 4');
    g+=el(4,-11,30,13,c);
    g+=catHead(-24,-16,13,c,true,st);
  }else if(pose==='peek'){
    g+=catHead(0,-14,16,c,false,st);
    g+=el(-10,0,6,4,c)+el(10,0,6,4,c);
  }else{
    g+=ln('M0 0 C-4 -20 14 -26 12 -40',O,10)+ln('M0 0 C-4 -20 14 -26 12 -40',c,6);
  }
  return g;
}

// ---------- props ----------
// w,h: size; m: hiding ways a cat can use with this thing; d(): drawing
const P={
 bed:{w:150,h:110,m:'top lie peek tail',d(){const c=pick(['#7fb8e8','#f6a3a3','#a5d86e','#c7a6ec']);return rc(-75,-110,14,110,'#fff6e8',5)+rc(-66,-70,140,46,'#f9e3b8',8)+pa('M-50 -74 q4 -26 44 -22 q16 6 8 30z','#fff')+pa('M-14 -76 h89 v54 h-100 q-4 -34 11 -54z',c)+ci(10,-60,4,'#fff',"")+ci(40,-50,4,'#fff',"")+ci(62,-64,4,'#fff',"")+rc(-66,-26,140,16,'#c98a52')+rc(-62,-12,8,12,'#fff6e8',2)+rc(62,-12,8,12,'#fff6e8',2);}},
 shelf:{w:100,h:160,m:'top lie peek side',d(){let s=rc(-50,-160,100,160,'#c98a52',4)+rc(-50,-108,100,7,'#a9703e')+rc(-50,-56,100,7,'#a9703e');let x=-44;for(let i=0;i<6;i++){const w=ri(9,13),h=ri(34,46);s+=rc(x,-108-h,w,h,PAL[(i*3+ri(0,2))%8],0,Kt);x+=w+2;}s+=rc(-42,-82,30,26,'#e46c6c',3)+ci(-34,-56,5,'#555')+ci(-20,-56,5,'#555');s+=ci(22,-70,12,'#7fc8f0')+pa('M-42 -46 h36 l-4 40 h-28z','#d9a066')+pa('M6 -46 h36 l-4 40 h-28z','#d9a066');return s;}},
 toybox:{w:84,h:66,m:'top lie peek side tail',d(){const c=pick(['#6c9fe4','#e46c6c','#8bc97a','#f6c445']);return rc(-40,-54,80,54,c,5)+rc(-44,-66,88,14,c,4)+pa('M-10 -30 l10 -9 l10 9 l-10 9z','#fff');}},

function themeOf(L){return THEMES[(L-1)%THEMES.length];}

// ---------- level builder ----------
function levelSpec(L){
  const W=Math.round(390+Math.min(L-1,24)*13), H=Math.round(W*1.75);
  return {W,H,n:Math.min(3+Math.floor((L-1)/2),12),cs:Math.max(.62-(L-1)*.012,.4),
    time:Math.min(70+Math.min(3+Math.floor((L-1)/2),12)*14,230)};
}
function modesFor(L){const m=['top','top','peek','peek'];if(L>=3)m.push('side','side');if(L>=5)m.push('lie');if(L>=7)m.push('tail');if(L>=12)m.push('tail','side');return m;}
function overlap(a,b,pad=0){return a.x0<b.x1-pad&&a.x1>b.x0+pad&&a.y0<b.y1-pad&&a.y1>b.y0+pad;}
function circRect(cx,cy,r,b){const x=Math.max(b.x0,Math.min(cx,b.x1)),y=Math.max(b.y0,Math.min(cy,b.y1));return (cx-x)**2+(cy-y)**2<r*r;}
function buildLevel(L,attempt=0){
  R=rng(L*7919+13+attempt*101);
  const T=themeOf(L);THEME=T;
  const sp=levelSpec(L),W=sp.W,H=sp.H,hz=Math.round(H*T.hz);
  const props=[];
  const tryPlace=(name,zone)=>{
    const p=P[name];
    for(let t=0;t<40;t++){
      let s,x,y;
      if(zone==='wall'){s=rf(.85,1.05);y=rf(H*.08+p.h*s,hz-14);}
      else{y=rf(hz+12,H-14);s=(.8+.45*(y-hz)/(H-hz))*rf(.9,1.08);}
      x=rf(p.w*s/2+4,W-p.w*s/2-4);
      const b={x0:x-p.w*s/2,x1:x+p.w*s/2,y0:y-p.h*s,y1:y};
      if(b.y0<4)continue;
      if(props.some(q=>overlap(b,q.b,Math.min(q.b.x1-q.b.x0,b.x1-b.x0)*.08)))continue;
      props.push({name,p,x,y,s,b,zone});return true;
    }return false;
  };
  // big things first so they fit, then fill
  const wallN=T.wall.length?Math.round(W/150)+1:0;
  for(let i=0;i<wallN;i++)tryPlace(T.wall[i%T.wall.length],'wall');
  const fl=T.floor.slice().sort((a,b)=>P[b].w*P[b].h-P[a].w*P[a].h);
  for(const n of fl)tryPlace(n,'floor');
  const target=Math.round(W*H/(12500-Math.min(L,20)*300));
  const used=n=>props.filter(q=>q.name===n).length;
  for(let i=0;i<target*3&&props.length<target;i++){const a=[pick(T.floor),pick(T.floor),pick(T.floor)].sort((x,y)=>used(x)-used(y));tryPlace(a[0],'floor');}
  // cats
  const cs=sp.cs*(W/390)**0.15, modes=modesFor(L), cats=[];
  const hosts=shuffle(props.filter(q=>q.p.m));
  const drawsAfter=(cat,q)=>q!==cat.host&&(q.zone==='floor'&&(cat.host.zone==='wall'||q.y>cat.host.y||(q.y===cat.host.y)));
  for(const h of hosts){
    if(cats.length>=sp.n)break;
    const ok=h.p.m.split(' ');
    const wanted=shuffle(modes.slice()).filter(m=>ok.includes(m));
    for(const mode of wanted){
      const c=placeCat(h,mode,cs);
      if(!c)continue;
      if(c.cy-c.r<2||c.cx-c.r<0||c.cx+c.r>W)continue;
      if(cats.some(o=>Math.hypot(o.cx-c.cx,o.cy-c.cy)<o.r+c.r+6))continue;
      c.host=h;
      if(props.some(q=>drawsAfter(c,q)&&circRect(c.cx,c.cy,c.r*.75,q.b)))continue;
      cats.push(c);break;
    }
  }
  if(cats.length<sp.n&&attempt<6)return buildLevel(L,attempt+1);
  // draw list
  const items=[];
  props.forEach(q=>items.push({k:(q.zone==='wall'?0:1e4)+q.y,svg:`<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) scale(${q.s.toFixed(3)})">${q.p.d()}</g>`}));
  cats.forEach((c,i)=>{c.id=i;items.push({k:(c.host.zone==='wall'?0:1e4)+c.host.y+(c.after?.01:-.01),cat:c});});
  items.sort((a,b)=>a.k-b.k);
  const bg=T.bg(W,H,hz);
  return {L,T,W,H,cats,items,bg,time:sp.time};
}
function placeCat(h,mode,cs){
  const {b}=h,ww=b.x1-b.x0,hh=b.y1-b.y0,flip=R()<.5,col=pick(CATC);
  const c={mode,cs,flip,col,pose:'sit',after:false};
  if(mode==='top'){if(ww<44*cs)return null;c.ax=rf(b.x0+Math.min(ww*.3,20*cs),b.x1-Math.min(ww*.3,20*cs));c.ay=b.y0+2;c.after=true;c.pose='sit';c.cx=c.ax;c.cy=c.ay-36*cs;c.r=32*cs;}
  else if(mode==='lie'){if(ww<70*cs)return null;c.ax=rf(b.x0+34*cs,b.x1-34*cs);c.ay=b.y0+2;c.after=true;c.pose='lie';c.cx=c.ax+(flip?6:-6)*cs;c.cy=c.ay-14*cs;c.r=30*cs;}
  else if(mode==='peek'){if(ww<36*cs)return null;c.ax=rf(b.x0+Math.min(ww*.3,18*cs),b.x1-Math.min(ww*.3,18*cs));c.ay=b.y0+3*cs;c.pose='peek';c.cx=c.ax;c.cy=c.ay-17*cs;c.r=22*cs;}
  else if(mode==='side'){if(hh<46*cs)return null;const sd=R()<.5?-1:1;c.flip=sd>0;c.ax=(sd<0?b.x0:b.x1)+sd*4*cs;c.ay=b.y1-rf(0,Math.max(0,hh-80*cs))*.3-2;c.pose='sit';c.cx=c.ax+sd*12*cs;c.cy=c.ay-36*cs;c.r=28*cs;}
  else if(mode==='tail'){if(ww<30*cs)return null;const sd=R()<.5?-1:1;c.flip=sd<0;c.ax=rf(b.x0+ww*.2,b.x1-ww*.2);c.ay=b.y0+10*cs;c.pose='tail';c.cx=c.ax+(c.flip?-6:6)*cs;c.cy=c.ay-28*cs;c.r=20*cs;}
  return c;
}
function catGroupSVG(c){return `<g transform="translate(${c.ax.toFixed(1)} ${c.ay.toFixed(1)})"><g class="catg" data-id="${c.id}"><g transform="scale(${(c.flip?-1:1)*c.cs} ${c.cs})">${catSVG(c.pose,c.col)}</g></g></g>`;}

// ---------- view (zoom/pan) ----------
const scene=$('scene'),world=$('world');
let view={s:1,tx:0,ty:0},fit=1,lev=null;
function playRect(){const hud=$('hud'),tools=$('tools');const top=hud.hidden?0:hud.offsetHeight;const bot=tools.hidden?0:scene.clientHeight-tools.getBoundingClientRect().top+scene.getBoundingClientRect().top+6;return {x:0,y:top,w:scene.clientWidth,h:scene.clientHeight-top-Math.max(0,bot)};}
function fitView(){const r=playRect();fit=Math.min(r.w/lev.W,r.h/lev.H);view.s=fit;view.tx=r.x+(r.w-lev.W*fit)/2;view.ty=r.y+(r.h-lev.H*fit)/2;applyView();}
function clampView(){
  const r=playRect();view.s=Math.max(fit,Math.min(fit*5,view.s));
  const cw=lev.W*view.s,ch=lev.H*view.s;
  view.tx=cw<=r.w?r.x+(r.w-cw)/2:Math.min(r.x,Math.max(r.x+r.w-cw,view.tx));
  view.ty=ch<=r.h?r.y+(r.h-ch)/2:Math.min(r.y,Math.max(r.y+r.h-ch,view.ty));
}
function applyView(){clampView();world.setAttribute('transform',`translate(${view.tx} ${view.ty}) scale(${view.s})`);}
function zoomAt(px,py,f){const wx=(px-view.tx)/view.s,wy=(py-view.ty)/view.s;view.s*=f;view.s=Math.max(fit,Math.min(fit*5,view.s));view.tx=px-wx*view.s;view.ty=py-wy*view.s;applyView();}
function toWorld(px,py){return {x:(px-view.tx)/view.s,y:(py-view.ty)/view.s};}

// pointer handling: one finger drags, two fingers pinch, a short still touch is a tap
const ptrs=new Map();let gest=null;
function localXY(e){const r=scene.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
scene.addEventListener('pointerdown',e=>{
  if(mode!=='play')return;scene.setPointerCapture(e.pointerId);
  const p=localXY(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1)gest={start:p,last:p,t:performance.now(),moved:false,multi:false};
  else if(gest){gest.multi=true;gest.pinch=pinchInfo();}
});
function pinchInfo(){const [a,b]=[...ptrs.values()];return {d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
scene.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest)return;const p=localXY(e);ptrs.set(e.pointerId,p);
  if(ptrs.size>=2){const pi=pinchInfo(),o=gest.pinch;if(o&&o.d>10){zoomAt(pi.mx,pi.my,pi.d/o.d);view.tx+=pi.mx-o.mx;view.ty+=pi.my-o.my;applyView();}gest.pinch=pi;gest.moved=true;return;}
  if(Math.hypot(p.x-gest.start.x,p.y-gest.start.y)>10)gest.moved=true;
  if(gest.moved){view.tx+=p.x-gest.last.x;view.ty+=p.y-gest.last.y;applyView();}
  gest.last=p;
});
function ptrEnd(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===1&&gest){gest.last=[...ptrs.values()][0];gest.pinch=null;}
  if(ptrs.size===0&&gest){const g=gest;gest=null;if(e.type==='pointerup'&&!g.moved&&!g.multi&&performance.now()-g.t<700)tapAt(g.start.x,g.start.y);}
}
scene.addEventListener('pointerup',ptrEnd);scene.addEventListener('pointercancel',ptrEnd);
scene.addEventListener('wheel',e=>{if(mode!=='play')return;e.preventDefault();const p=localXY(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);},{passive:false});
$('zIn').onclick=()=>{const r=playRect();zoomAt(r.x+r.w/2,r.y+r.h/2,1.4);};
$('zOut').onclick=()=>{const r=playRect();zoomAt(r.x+r.w/2,r.y+r.h/2,1/1.4);};

// ---------- sound ----------
let AC=null;
function tone(f1,f2,dur,type='sine',vol=.18,delay=0){
  if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
const sndFound=()=>{tone(700,1100,.12,'triangle');tone(1100,600,.22,'triangle',.15,.1);};
const sndWrong=()=>tone(220,120,.3,'square',.08);
const sndWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'triangle',.16,i*.13));
const sndOver=()=>[392,330,262].forEach((f,i)=>tone(f,f*.98,.28,'sine',.16,i*.2));
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

// ---------- game ----------
let mode='menu',game=null;
function trayIcon(c){return `<svg viewBox="-24 -36 48 40" data-id="${c.id}">${catHead(0,-14,16,c.col,false,stripeOf(c.col))}</svg>`;}
function startLevel(L){
  curLevel=L;sv('level',L);
  lev=buildLevel(L);
  world.innerHTML=`<g>${lev.bg}</g>`+lev.items.map(it=>it.cat?catGroupSVG(it.cat):it.svg).join('')+`<g id="marks"></g>`;
  game={left:lev.time,total:lev.time,hearts:3,found:new Set(),hintOn:null,over:false};
  mode='play';
  ['menu','winBox','overBox','helpBox','shopBox'].forEach(i=>$(i).hidden=true);
  $('hud').hidden=false;$('tools').hidden=false;
  $('lvTitle').textContent='레벨 '+L;$('lvTheme').textContent=lev.T.name+' · 고양이 '+lev.cats.length+'마리';
  $('tray').innerHTML=lev.cats.map(trayIcon).join('');
  updHud();requestAnimationFrame(fitView);
}
function updHud(){
  $('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<game.hearts?'':'lost'}">❤️</span>`).join('');
  $('hudCoins').textContent=coins;$('hintN').textContent=hints;
  const f=Math.max(0,game.left/game.total);$('timeFill').style.width=(f*100)+'%';$('timeFill').classList.toggle('low',game.left<15);
  $('secs').textContent=Math.ceil(Math.max(0,game.left));
}
function tapAt(px,py){
  if(!game||game.over)return;
  const w=toWorld(px,py),tol=16/view.s;
  let best=null,bd=1e9;
  for(const c of lev.cats){const d=Math.hypot(w.x-c.cx,w.y-c.cy);if(d<=c.r*1.3+tol&&d-c.r<bd){bd=d-c.r;best=c;}}
  if(best){if(!game.found.has(best.id))foundCat(best);return;}
  wrongTap(w);
}
function foundCat(c){
  game.found.add(c.id);sndFound();vib(30);
  const marks=$('marks');
  const ring=document.createElementNS(NS,'circle');ring.setAttribute('class','ring');ring.setAttribute('cx',c.cx);ring.setAttribute('cy',c.cy);ring.setAttribute('r',c.r+6);marks.appendChild(ring);
  const g=world.querySelector(`.catg[data-id="${c.id}"]`);if(g){g.classList.remove('found');void g.getBBox;g.classList.add('found');}
  $('tray').querySelector(`svg[data-id="${c.id}"]`).classList.add('on');
  if(game.hintOn===c.id){const h=$('hintRing');h&&h.remove();game.hintOn=null;}
  if(game.found.size===lev.cats.length)setTimeout(win,700);
}
function wrongTap(w){
  game.hearts--;sndWrong();vib([60,40,60]);
  const x=document.createElementNS(NS,'text');const fs=34/view.s;
  x.setAttribute('x',w.x);x.setAttribute('y',w.y+fs*.35);x.setAttribute('font-size',fs);x.setAttribute('text-anchor','middle');x.setAttribute('fill','#ff3b3b');x.setAttribute('font-weight','bold');x.setAttribute('stroke','#fff');x.setAttribute('stroke-width',3/view.s);x.setAttribute('paint-order','stroke');x.setAttribute('class','miss');x.textContent='✕';
  $('marks').appendChild(x);setTimeout(()=>x.remove(),900);
  const hs=$('hearts');hs.classList.remove('shake');void hs.offsetWidth;hs.classList.add('shake');
  updHud();
  if(game.hearts<=0)lose('heart');
}
function useHint(){
  if(mode!=='play'||game.over)return;
  if(game.hintOn!==null)return centerOn(lev.cats[game.hintOn]);
  if(hints<=0){openShop();return;}
  const left=lev.cats.filter(c=>!game.found.has(c.id));if(!left.length)return;
  const c=left[Math.floor(Math.random()*left.length)];
  hints--;sv('hints',hints);game.hintOn=c.id;
  const h=document.createElementNS(NS,'circle');h.id='hintRing';h.setAttribute('class','hintring');h.setAttribute('cx',c.cx);h.setAttribute('cy',c.cy);h.setAttribute('r',c.r+10);$('marks').appendChild(h);
  tone(900,1300,.25,'sine',.12);centerOn(c);updHud();
}
function centerOn(c){const r=playRect();const sx=view.tx+c.cx*view.s,sy=view.ty+c.cy*view.s;if(sx<r.x+30||sx>r.x+r.w-30||sy<r.y+30||sy>r.y+r.h-30){view.tx=r.x+r.w/2-c.cx*view.s;view.ty=r.y+r.h/2-c.cy*view.s;applyView();}}
function openShop(){$('shopCoins').textContent=coins;$('buyBtn').disabled=coins<HINT_PRICE;$('shopBox').hidden=false;if(game)game.paused=true;}
$('buyBtn').onclick=()=>{if(coins<HINT_PRICE)return;coins-=HINT_PRICE;hints++;sv('coins',coins);sv('hints',hints);tone(800,1200,.15,'triangle');$('shopBox').hidden=true;if(game){game.paused=false;updHud();useHint();}refreshMenu();};
$('shopClose').onclick=()=>{$('shopBox').hidden=true;if(game)game.paused=false;};
$('hintBtn').onclick=useHint;
function win(){
  if(game.over)return;game.over=true;mode='end';sndWin();
  const isNew=curLevel>=maxLevel;
  const gain=10+game.hearts*5;coins+=gain;let hg=0;
  if(isNew){hg=1;maxLevel=curLevel+1;sv('max',maxLevel);}
  hints+=hg;sv('coins',coins);sv('hints',hints);
  $('winSub').textContent=`고양이 ${lev.cats.length}마리를 다 찾았어요`;
  $('winReward').innerHTML=`<span>🪙 +${gain}</span>`+(hg?`<span>🔍 +${hg}</span>`:'');
  updHud();setTimeout(()=>{$('winBox').hidden=false;},300);
}
function lose(why){
  if(game.over)return;game.over=true;mode='end';sndOver();
  // show where the missed cats were
  lev.cats.filter(c=>!game.found.has(c.id)).forEach(c=>{const h=document.createElementNS(NS,'circle');h.setAttribute('class','hintring');h.setAttribute('cx',c.cx);h.setAttribute('cy',c.cy);h.setAttribute('r',c.r+8);$('marks').appendChild(h);});
  $('overEmoji').textContent=why==='time'?'⏰':'💔';
  $('overSub').textContent=(why==='time'?'시간이 다 됐어요.':'하트가 다 없어졌어요.')+' 노란 동그라미에 고양이가 있었어요!';
  fitView();setTimeout(()=>{$('overBox').hidden=false;},1600);
}
$('winNext').onclick=()=>startLevel(curLevel+1);
$('winMenu').onclick=()=>{curLevel=Math.min(curLevel+1,maxLevel);showMenu();};
$('overRetry').onclick=()=>startLevel(curLevel);
$('overMenu').onclick=showMenu;
$('homeBtn').onclick=showMenu;

let lastT=0;
function loop(t){
  const dt=Math.min(.25,(t-lastT)/1000||0);lastT=t;
  if(mode==='play'&&game&&!game.over&&!game.paused&&!document.hidden){game.left-=dt;if(game.left<=0){game.left=0;updHud();lose('time');}else if(Math.floor(game.left*4)!==Math.floor((game.left+dt)*4))updHud();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- menu ----------
function showMenu(){
  mode='menu';game=null;['hud','tools','winBox','overBox','shopBox'].forEach(i=>$(i).hidden=true);$('menu').hidden=false;refreshMenu();
}
function refreshMenu(){
  curLevel=Math.max(1,Math.min(curLevel,maxLevel));sv('level',curLevel);
  $('menuLvl').textContent='레벨 '+curLevel;
  $('menuTheme').textContent=themeOf(curLevel).name+(curLevel<maxLevel?' ✔':'');
  $('lvPrev').disabled=curLevel<=1;$('lvNext').disabled=curLevel>=maxLevel;
  $('menuCoins').textContent=coins;$('menuHints').textContent=hints;
  $('soundBtn').textContent=soundOn?'🔊':'🔇';
}
$('lvPrev').onclick=()=>{curLevel--;refreshMenu();};
$('lvNext').onclick=()=>{curLevel++;refreshMenu();};
$('startBtn').onclick=()=>{tone(600,900,.1,'triangle');startLevel(curLevel);};
$('helpBtn').onclick=()=>{$('helpBox').hidden=false;};
$('helpOk').onclick=()=>{$('helpBox').hidden=true;};
$('soundBtn').onclick=()=>{soundOn=!soundOn;sv('sound',soundOn);refreshMenu();};
function heroSVG(){return pa('M-46 -2 h92 v-46 h-92z','#6c9fe4')+`<g transform="translate(0 -44) scale(1.25)">${catSVG('peek','#f39a3d')}</g>`+rc(-52,-52,104,14,'#4f84cc',4)+pa('M-12 -24 l12 -10 l12 10 l-12 10z','#f6c445');}
$('hero').innerHTML=`<g class="heroc">${heroSVG()}</g>`;
window.__iconSVG=()=>`<svg xmlns="${NS}" viewBox="0 0 512 512"><rect width="512" height="512" fill="#ffd7a6"/><circle cx="256" cy="270" r="210" fill="#ffeccf"/><g transform="translate(256 430) scale(3.2)">${heroSVG()}</g></svg>`;
window.__debug={get lev(){return lev;},get game(){return game;},get view(){return view;},tapWorld(x,y){tapAt(view.tx+x*view.s,view.ty+y*view.s);},startLevel};
addEventListener('resize',()=>{if(lev&&mode!=='menu')fitView();});
refreshMenu();
</script>
</body>
</html>
